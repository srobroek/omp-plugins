# speckit-basic -- spec-kit core plus the three human gates, nothing optional.
#
# Install: copy this file into <repo>/.beads/formulas/ (or ~/.beads/formulas/).
# Pour one molecule per feature:
#   bd mol pour speckit-basic --var feature=<NNN-slug>
#
# 10 steps. Every /speckit.* command here ships with spec-kit itself: specify,
# clarify, plan, tasks, analyze. No community extension is required.
#
# Every join is written for this step set rather than inherited, so each step's
# `needs` names at least one unconditional step: a step whose whole `needs` list is
# filtered keeps only its parent edge and becomes immediately ready, with no error
# at pour. `implement` names `analyze` as well as `analyze-approval` for exactly
# that reason.
formula = "speckit-basic"
description = "SpecKit basic profile for {{feature}}: specify through implement with human approval gates, no extensions required"
type = "workflow"

[vars.feature]
required = true
pattern = "^[0-9]{3}-[a-z0-9-]+$"

# Human approval, or explicit permission to proceed without one. Same semantics as
# speckit-feature: default "no" keeps the three approvals in the DAG; "yes" filters
# them out for an unattended run, because `bd gate check` does not see a human gate
# and the molecule would stall with `bd ready` empty.
#
# Skipping a gate does not skip its judgement: record on the preceding step's bead
# what a reviewer would have been asked, before closing it.
[vars.autonomous]
required = false
default = "no"

# Accepted for interface parity with speckit-feature and speckit-lean, and it
# conditions no step here.
#
# This profile has no assign/validate chain to drop: /speckit.agent-assign.* is the
# agent-assign extension, and basic carries nothing optional. `implement` therefore
# works the task beads under it directly, on every pour, whether or not the
# extension is installed. Pour speckit-lean or speckit-feature to get the
# assign -> validate -> execute chain.
[vars.agent_assign]
required = false
default = "yes"

[[steps]]
id = "specify"
title = "specify {{feature}}"
type = "task"
description = "Run /speckit.specify to create specs/{{feature}}/spec.md. PRECONDITION: the /speckit.* skills come from spec-kit, which this package does not ship -- run the speckit-setup skill first. All five command steps here are spec-kit core; no community extension is needed."

[steps.metadata]
skill_hints = "speckit.specify"

[[steps]]
id = "clarify"
title = "clarify {{feature}}"
type = "task"
needs = ["specify"]
description = "Run /speckit.clarify (interactive). Carry each open question on its own escalation wisp (bd create \"[wisp:escalation] <step-id>: <q>\" --ephemeral --wisp-type escalation, linked relates-to this step); encode every answer into spec.md, then burn the wisp. The spec is the durable record."

[steps.metadata]
skill_hints = "speckit.clarify"
execution_mode = "interactive"

[[steps]]
id = "clarify-approval"
title = "clarify approval {{feature}}"
type = "task"
needs = ["clarify"]
description = "Human sign-off on the clarified spec. Close the gate only after the user approves interactively. Nudge a stalled gate with a ping wisp; only bd gate resolve closes the gate."

condition = "{{autonomous}} == no"
[steps.gate]
type = "human"

[[steps]]
id = "plan"
title = "plan {{feature}}"
type = "task"
needs = ["clarify", "clarify-approval"]
description = "Run /speckit.plan to produce plan.md and design artifacts."

[steps.metadata]
skill_hints = "speckit.plan"

[[steps]]
id = "tasks"
title = "tasks {{feature}}"
type = "task"
needs = ["plan"]
description = "Run /speckit.tasks, then create the task breakdown as child beads of the implement step (bd create --parent <implement-id> --spec-id {{feature}}). Never write specs/{{feature}}/tasks.md; the write is denied."

[steps.metadata]
skill_hints = "speckit.tasks"

[[steps]]
id = "analyze"
title = "analyze {{feature}}"
type = "task"
needs = ["tasks"]
description = "Run /speckit.analyze (interactive cross-artifact risk analysis). Task state comes from bd list --spec {{feature}}, not tasks.md. Carry unresolved findings on escalation wisps and encode the resolution into spec.md or plan.md before burning them."

[steps.metadata]
skill_hints = "speckit.analyze"
execution_mode = "interactive"

[[steps]]
id = "analyze-approval"
title = "analyze approval {{feature}}"
type = "task"
needs = ["analyze"]
description = "Human sign-off on analysis findings. Close the gate only after the user approves interactively. Nudge a stalled gate with a ping wisp; only bd gate resolve closes the gate."

condition = "{{autonomous}} == no"
[steps.gate]
type = "human"

[[steps]]
id = "implement"
title = "implement {{feature}}"
type = "task"
needs = ["analyze", "analyze-approval"]
description = "Work the implementation task beads that are children of this step: bd ready -> bd update <id> --claim -> bd close <id> --reason. There is no assign/validate chain in this profile. Per-file progress and retries ride a [wisp:worklog] wisp linked relates-to this step; the step thread keeps the outcome only. Keep this step open until every child is closed -- bd close on a parent with open children succeeds silently."

[[steps]]
id = "verify-signoff"
title = "verify sign-off {{feature}}"
type = "task"
needs = ["implement"]
description = "Human sign-off that the implementation matches spec.md. There is no verify agent step in this profile, so this gate is the whole verification: read the diff against the spec before resolving. Close the gate only after the user approves interactively."

condition = "{{autonomous}} == no"
[steps.gate]
type = "human"

[[steps]]
id = "final-checkpoint"
title = "final checkpoint {{feature}}"
type = "task"
needs = ["implement", "verify-signoff"]
description = "Final commit + tag (git, no extension), then close out the molecule (bd dolt push)."
