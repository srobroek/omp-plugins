name: renovate-dist-build

# The unprivileged half of the generated-dist automation.
#
# A dependency bump changes a plugin's package.json, but the committed dist/
# bundle still carries the old version inlined, so ci.yml's "Extension bundles
# are current" gate fails by design. This job rebuilds the bundles and the
# third-party notices from the pull request head and uploads them as an artifact.
#
# It runs pull-request code — `bun install` executes dependency lifecycle scripts
# and `bun build` evaluates plugin sources — so it holds no credentials: the
# workflow asks for `contents: read` only and references no secret (unlike a
# Dependabot run, a Renovate `pull_request` run is not stripped of secrets by
# GitHub, so the absence is this file's own discipline), and
# `persist-credentials: false` keeps even the read token out of the checkout. renovate-dist.yml publishes the artifact separately, from the
# default branch, and re-derives every judgement about it there.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: renovate-dist-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.actor == 'renovate[bot]' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The exact head commit, not the `pull_request` default merge ref: the
      # publish job pushes onto that commit, so the rebuild must describe it and
      # not a merge with main that never existed on the branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: build-extensions.py --check byte-compares committed dist/
          # bundles against a fresh build, so the CI bun MUST match the bun that
          # built the committed bundles. Bump together with a dist rebuild
          # (renovate-dist rebuilds automatically on Renovate branches).
          bun-version: "1.4.2"

      - name: Rebuild extension bundles
        run: |
          set -euo pipefail
          # Every dependency-bearing plugin Renovate covers: dep-update and
          # whats-new bundle smol-toml, so build-extensions.py needs their
          # node_modules too. --frozen-lockfile matches ci.yml, so the lockfile
          # Renovate wrote is the one that gets bundled.
          while IFS= read -r pkg; do
            if python3 -c "import json,sys; sys.exit(0 if json.load(open('$pkg')).get('dependencies') else 1)"; then
              (cd "$(dirname "$pkg")" && bun install --frozen-lockfile --silent)
            fi
          done < <(git ls-files '*/package.json')
          python3 scripts/build-extensions.py

      - name: Stage the generated output
        id: stage
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The pathspec is the first narrowing and scripts/renovate-dist-guard.py
          # is the second: it re-checks every path against the same allowlist the
          # publish job applies, so a rebuild that touched anything else fails here
          # instead of arriving as an unexplained artifact entry.
          git add -- '*/dist/*.js'
          git diff --cached --name-only -- '*/dist/*.js' > "$RUNNER_TEMP/changed.txt"
          python3 scripts/renovate-dist-guard.py stage \
            --repo . \
            --changed "$RUNNER_TEMP/changed.txt" \
            --out "$RUNNER_TEMP/renovate-dist" \
            --repository "$GITHUB_REPOSITORY" \
            --head-ref "$HEAD_REF" \
            --head-sha "$HEAD_SHA"

      # Uploaded even when nothing changed (the artifact then carries only its
      # metadata), so the publish job always finds an artifact and can end quietly
      # instead of failing the download on every bump that needs no rebuild.
      - name: Upload the generated output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-dist
          path: ${{ runner.temp }}/renovate-dist
          if-no-files-found: error
          retention-days: 1
