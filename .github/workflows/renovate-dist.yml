name: renovate-dist

# Renovate bumps a plugin's package.json dependency, but the committed dist/
# bundle still carries the old version inlined, so the "Extension bundles are
# current" gate fails by design. This rebuilds the bundles on Renovate branches
# and pushes the sync commit with the publish App token so CI re-runs.

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - name: Mint release-app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: build-extensions.py --check byte-compares committed dist/
          # bundles against a fresh build, so the CI bun MUST match the bun that
          # built the committed bundles. Bump together with a dist rebuild
          # (renovate-dist rebuilds automatically on renovate branches).
          bun-version: "1.4.0"

      - name: Rebuild extension bundles
        run: |
          python3 scripts/build-extensions.py
          if ! git diff --quiet; then
            git config user.name "release-app[bot]"
            git config user.email "release-app[bot]@users.noreply.github.com"
            git commit -am "chore: rebuild extension bundles for dependency bump"
            git push
          fi
