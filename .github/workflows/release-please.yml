name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # OMP compares `plugins[].version` in the top-level catalog, while
      # release-please only bumps the per-plugin manifests it is pointed at. The
      # catalog is therefore regenerated and pushed onto the release PR branch.
      - uses: actions/checkout@v4
        if: steps.release.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - uses: actions/setup-python@v5
        if: steps.release.outputs.prs_created == 'true'
        with:
          python-version: "3.13"

      - name: Regenerate catalog on the release branch
        if: steps.release.outputs.prs_created == 'true'
        run: |
          python3 scripts/build-catalog.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: sync marketplace catalog versions"
            git push
          fi
