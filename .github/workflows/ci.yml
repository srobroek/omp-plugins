name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0


      - name: Install cargo-binstall
        if: ${{ github.event_name == 'pull_request' }}
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0

      - name: Install agnix
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BINSTALL_DISABLE_TELEMETRY: "true"
        run: cargo binstall agnix-cli@0.54.0 --no-confirm

      - name: Staged agentic check
        if: ${{ github.event_name == 'pull_request' }}
        env:
          AGNIX_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          index="$(mktemp)"
          rm -f "$index"
          trap 'rm -f "$index"' EXIT
          export GIT_INDEX_FILE="$index"
          git read-tree HEAD
          python3 scripts/check-agnix-staged.py

      - name: Agnix hook regression cases
        if: ${{ github.event_name == 'pull_request' }}
        run: python3 scripts/test-agnix-hook.py
      # OMP identifies a skill, agent, rule, or command by its bare `name` and keeps
      # the first match across every source, so a duplicate name silently shadows the
      # other plugin. `omp plugin doctor` only inspects one installed plugin, so this
      # repository-wide check has no native equivalent.
      - name: Capability name collisions
        run: python3 scripts/check-duplicate-names.py

      # The silent failures: a rule with no description lands in no bucket, a
      # frontmatter name that disagrees with its filename is not the identity OMP
      # uses, and a re-shipped bundled agent name shadows the bundled definition.
      - name: Capability discovery contract
        run: python3 scripts/check-contract.py

      # The catalog is a release artifact, not a hand-maintained file: OMP reads
      # `plugins[].version` from it, while release-please bumps only the per-plugin
      # manifests it is pointed at. This catches a catalog that drifted from them.
      - name: Catalog matches the plugin manifests
        run: python3 scripts/build-catalog.py --check

      - name: release-please config covers every plugin
        run: python3 scripts/build-release-config.py --check

      - name: Plugin manifests are current
        run: |
          python3 scripts/sync-plugin-manifests.py --check

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned: build-extensions.py --check byte-compares committed dist/
          # bundles against a fresh build, so the CI bun MUST match the bun that
          # built the committed bundles. Bump together with a dist rebuild
          # (dependabot-dist rebuilds automatically on Dependabot branches).
          bun-version: "1.4.2"

      - name: Root TypeScript quality
        run: |
          bun install --frozen-lockfile --silent
          bun run typecheck
          bun run lint
      # Plugins that declare real `dependencies` need node_modules present before
      # their sources can resolve imports; the committed dist/ bundles cover the
      # consumer machines, but this runner builds from source.

      - name: Install plugin dependencies
        run: |
          while IFS= read -r pkg; do
            if python3 -c "import json,sys; sys.exit(0 if json.load(open('$pkg')).get('dependencies') else 1)"; then
              (cd "$(dirname "$pkg")" && bun install --frozen-lockfile --silent)
            fi
          done < <(git ls-files '*/package.json')

      - name: Browser-tools third-party notices are current
        run: bun browser-tools/scripts/generate-third-party-notices.ts --check

      - name: Shipped asset metadata and trigger syntax
        run: bun scripts/check-agentic-metadata.ts
      - name: Catalog and capability negative checks
        run: |
          python3 scripts/check-catalog-validation.py
          python3 scripts/check-design-structure.py
          python3 scripts/check-mcp-servers.py
          python3 scripts/test-checker-contracts.py
      - name: Files duplicated across plugins are identical
        run: python3 scripts/check-shared-detector.py

      # Every extension module must at least parse and bundle. Committed dist/
      # bundles must match a fresh build (git installs run no install step on the
      # consumer's machine); the check fails when a bundle is stale.
      - name: Extension modules parse
        run: |
          status=0
          while IFS= read -r f; do
            bun build --target=bun "$f" --outdir /tmp/extcheck --external '@oh-my-pi/*' >/dev/null || { echo "FAIL $f"; status=1; }
          done < <(git ls-files '*/extensions/*.ts' | grep -v '\.test\.ts$')
          exit $status

      - name: Extension bundles are current
        run: python3 scripts/build-extensions.py --check

      - name: Extension tests
        run: |
          host="$RUNNER_TEMP/omp-session-host"
          mkdir -p "$host"
          printf '%s\n' '{"name":"omp-session-ci","private":true}' > "$host/package.json"
          # The root manifest is the authority for the OMP version this checkout
          # targets, so this host and the development pins move in one commit.
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["devDependencies"]["@oh-my-pi/pi-coding-agent"])')"
          (cd "$host" && bun add --no-save --silent "@oh-my-pi/pi-coding-agent@$version")
          ln -s "$host/node_modules" session/node_modules
          trap 'rm -f session/node_modules' EXIT
          while IFS= read -r d; do
            (cd "$d/.." && bun test extensions/) || exit 1
          done < <(git ls-files '*/extensions/*.test.ts' | grep -v '\.git\.test\.ts$' | xargs -rn1 dirname | sort -u)
          bun run test:git
      - name: Loader smoke against pinned OMP
        timeout-minutes: 10
        env:
          OMP_HOST_ROOT: ${{ runner.temp }}/omp-session-host/node_modules/@oh-my-pi/pi-coding-agent
          OMP_BIN: ${{ runner.temp }}/omp-session-host/node_modules/.bin/omp
        run: bun scripts/check-plugin-loading.ts

      # A rule's `condition` is a regex with no compiler and no type check: the only
      # thing that catches a false positive is a corpus. These tests read the
      # condition straight out of the rule's frontmatter, so a regex edit that
      # reintroduces a known false positive fails here.
      - name: Rule corpus tests
        run: |
          while IFS= read -r d; do
            (cd "$d/.." && bun test rules/) || exit 1
          done < <(git ls-files '*/rules/*.test.ts' | xargs -rn1 dirname | sort -u)

      # `uvx` is not preinstalled on GitHub runners.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # The Dependabot policy is a cross-file contract: the group name that
      # dependabot-automerge.yml merges on, the semver-qualified ignore spellings
      # that actually suppress OMP minors, one entry per lockfile, the manifest
      # being the only place an OMP version is written, and the split that keeps the
      # dist rebuild's write token away from pull-request code. Nothing else fails
      # when those drift.
      - name: Dependabot policy contract
        run: uvx --from pyyaml==6.0.3 python scripts/check-dependabot-config.py

      # A validator that reads a file and finds nothing wrong looks exactly like a
      # validator that stopped looking, so every contract above gets a mutation, and
      # the dist guard gets the rejections it exists for.
      - name: Dependabot policy and dist guard contracts
        run: uvx --from pyyaml==6.0.3 python scripts/test-dependabot-contracts.py

      - name: Install Vale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/vale"
          gh release download v3.17.1 --repo errata-ai/vale \
            --pattern vale_3.17.1_Linux_64-bit.tar.gz --dir "$RUNNER_TEMP/vale"
          printf '%s  %s\n' \
            db947f89f2292e6a0381a61de155f6a5f5cb4cb460ca178ea412ef605559cefd \
            "$RUNNER_TEMP/vale/vale_3.17.1_Linux_64-bit.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/vale/vale_3.17.1_Linux_64-bit.tar.gz" \
            -C "$RUNNER_TEMP/vale" vale
          echo "$RUNNER_TEMP/vale" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/vale/vale" --version

      - name: Prose checker failure contracts
        run: uvx --from slopvac==2.3.2 python scripts/check-prose-gate.py

      - name: Prose gate
        run: uvx --from slopvac==2.3.2 python scripts/prose-gate.py README.md --profile normal
