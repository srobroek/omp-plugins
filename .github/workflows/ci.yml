name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # OMP identifies a skill, agent, rule, or command by its bare `name` and keeps
      # the first match across every source, so a duplicate name silently shadows the
      # other plugin. `omp plugin doctor` only inspects one installed plugin, so this
      # repository-wide check has no native equivalent.
      - name: Capability name collisions
        run: python3 scripts/check-duplicate-names.py

      # The silent failures: a rule with no description lands in no bucket, a
      # frontmatter name that disagrees with its filename is not the identity OMP
      # uses, and a re-shipped bundled agent name shadows the bundled definition.
      - name: Capability discovery contract
        run: python3 scripts/check-contract.py

      # The catalog is a release artifact, not a hand-maintained file: OMP reads
      # `plugins[].version` from it, while release-please bumps only the per-plugin
      # manifests it is pointed at. This catches a catalog that drifted from them.
      - name: Catalog matches the plugin manifests
        run: python3 scripts/build-catalog.py --check

      - name: release-please config covers every plugin
        run: python3 scripts/build-release-config.py --check

      - name: Plugin manifests are current
        run: |
          python3 scripts/sync-plugin-manifests.py
          git diff --exit-code -- '*/.omp-plugin/plugin.json'

      # `uvx` is not preinstalled on GitHub runners.
      - uses: astral-sh/setup-uv@v5

      - name: Prose gate
        run: uvx slopvac README.md --profile normal
