version: 2

# Dependency updates for this repository. Renovate previously owned this job and
# automerged every minor and patch bump of every package; Dependabot replaces it
# with a narrower policy that keeps the pinned OMP host current and nothing else.
#
# @oh-my-pi/* patch and minor bumps arrive as one grouped PR named `omp`, the
# only updates dependabot-automerge.yml merges unattended, and only after the
# whole ci workflow, loader smoke included, has passed on the PR's head. A minor
# that changes the extension SDK the plugins compile against fails that CI and
# stays open for a human. Major OMP bumps are ignored here on purpose:
# omp-major-issue.yml opens a compatibility issue instead, so a human decides
# when this checkout moves to a new OMP major.
#
# One entry per directory that carries a bun.lock, because Dependabot only reads
# the manifest in the directory it is pointed at: the root workspace plus the
# published plugins that declare real dependencies and ship committed dist/
# bundles. An unpublished plugin (`"publish": false`) is not watched; its pins
# move by hand. scripts/check-dependabot-config.py fails
# when a lockfile appears without an entry, so a new dependency-bearing plugin
# cannot go unwatched.
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: daily
    groups:
      # The group name is a contract: dependabot-automerge.yml gates on it, and
      # scripts/check-dependabot-config.py fails when the two drift apart.
      omp:
        patterns:
          - "@oh-my-pi/*"
        update-types:
          - minor
          - patch
    ignore:
      # `ignore[].update-types` takes the semver-qualified spelling; the bare
      # `major` accepted under `groups` is silently not a match here, so an
      # unqualified value would leave OMP majors auto-opening PRs.
      - dependency-name: "@oh-my-pi/*"
        update-types:
          - version-update:semver-major

  # dep-update and whats-new depend only on smol-toml. No OMP grouping: the group
  # exists so dependabot-automerge.yml can merge OMP bumps unattended, and
  # an empty group here would let a non-OMP bump inherit that clearance.
  - package-ecosystem: bun
    directory: /dep-update
    schedule:
      interval: daily

  - package-ecosystem: bun
    directory: /whats-new
    schedule:
      interval: daily
  # Renovate no longer maintains action pins, so Dependabot watches the pinned
  # GitHub Actions references as well.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
