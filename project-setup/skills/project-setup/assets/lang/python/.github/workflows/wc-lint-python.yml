name: Lint Python

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory to run in. Set this per member in a monorepo.
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # GitHub defaults to 360 minutes, so a hung job burns six runner hours.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The default leaves GITHUB_TOKEN in .git/config, where any later step
          # can read it. zizmor reports the default as a finding.
          persist-credentials: false

      - uses: ./.github/actions/setup-python
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Dependencies
        run: uv run deptry .
