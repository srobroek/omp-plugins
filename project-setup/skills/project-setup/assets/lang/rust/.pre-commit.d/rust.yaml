# Folded into .pre-commit-config.yaml by `just hooks-merge`, or read directly by
# prek's workspace mode when this sits in a monorepo member.
#
# cargo fmt rewrites files, so it stays a hook. clippy and cargo-deny read
# committed state and also run in CI, which is what actually gates a merge.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-machete
        name: cargo machete (unused dependencies)
        entry: cargo machete
        language: system
        files: '\.(rs|toml)$'
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
