# A job fragment the host layer's wc-security.yml folds into its matrix. CodeQL's
# language name is not ours: it analyses TypeScript under javascript-typescript.
codeql:
  supported: true
  language: javascript-typescript
osv:
  lockfiles: ["bun.lock", "package-lock.json", "pnpm-lock.yaml"]
trivy:
  mode: fs
  scanners: ["vuln", "secret"]

# The opengrep ruleset for this language. The host layer's wc-security.yml reads this and
# passes each pack as its own `--config`, so a language contributes its rules the same way
# it contributes a CodeQL language or a trivy mode.
opengrep:
  packs: ["p/typescript"]
