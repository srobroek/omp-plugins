name: Setup Go
description: Install the pinned toolchain and warm the module and build caches.

inputs:
  working-directory:
    description: >-
      Directory holding this member's go.mod and go.sum. Set this per member in a
      monorepo; the default is the repository root.
    required: false
    default: "."

runs:
  using: composite
  steps:
    # A composite action does not inherit the calling job's `defaults.run`, and a
    # `uses:` step has no working directory at all, so every path below is resolved
    # to an absolute one here rather than left for the nested action to guess.
    - name: Resolve the working directory
      id: dir
      shell: bash
      # Read through the environment: interpolating an input into the script body is
      # the template-injection finding zizmor reports.
      env:
        INPUT_DIR: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        case "/$INPUT_DIR/" in
          //* | */../*)
            echo "working-directory must be a relative path inside the repository, got: $INPUT_DIR" >&2
            exit 1
            ;;
        esac
        cd -- "$INPUT_DIR"
        echo "path=$PWD" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: ${{ steps.dir.outputs.path }}/go.mod
        cache: true
        # Named explicitly: with this left out setup-go reads go.sum from the
        # workspace root and fails outright when the module is a member directory.
        cache-dependency-path: ${{ steps.dir.outputs.path }}/go.sum
