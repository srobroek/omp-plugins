# A job fragment the host layer's wc-security.yml folds into its matrix.
#
# Stated rather than omitted, which is the convention the other language layers follow: an
# absent fragment is indistinguishable from a layer nobody got round to, while
# `supported: false` is a claim someone made.
#
# CodeQL has no extractor for an OpenAPI document, and there is no lockfile for OSV to read.
# trivy's secret scanner does apply: a contract carries example values, and an example
# holding a real token is a leak the same as any other.
codeql:
  supported: false
osv:
  lockfiles: []
trivy:
  mode: fs
  scanners: ["secret"]

# No opengrep pack: its rules match code constructs, and a contract is data. Stated rather
# than omitted, so the discovery step's empty list is a claim rather than a gap.
opengrep:
  packs: []
