# .mise/conf.d/api.toml -- mise reads every file in this directory.
#
# Concrete pins rather than `latest`: vacuum's rule set and oasdiff's breaking-change
# classification both decide whether CI passes, so a floating version changes the gate with no
# diff here. Renovate owns the bump.
[tools]
vacuum = "0.30.3"
# ubi, not aqua: the aqua registry carries no oasdiff entry, so `aqua:oasdiff/oasdiff`
# resolves nothing. ubi reads the GitHub releases directly.
#
# 1.26.1 is the version the `--fail-on ERR` behaviour was verified against: without the flag it
# printed every breaking change and still exited 0.
"ubi:oasdiff/oasdiff" = "1.26.1"
