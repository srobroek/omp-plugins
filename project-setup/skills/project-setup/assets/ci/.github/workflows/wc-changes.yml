name: Changes

# Path filtering as a reusable job. The caller passes a filter spec and gates each
# downstream job on the matching output, so a push touching one package does not
# run every other package's tests.
#
# `on.push.paths` cannot do this: it decides whether the whole workflow runs, not
# which jobs inside it run, and a workflow that never runs leaves a required check
# pending forever rather than passing.

on:
  workflow_call:
    inputs:
      filters:
        description: |
          dorny/paths-filter spec as YAML, one key per area. For example:
            python: ['src/**', 'pyproject.toml']
            ts: ['web/**', 'package.json']
        required: true
        type: string
    outputs:
      changes:
        description: JSON array of the filter keys that matched.
        value: ${{ jobs.changes.outputs.changes }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The default leaves GITHUB_TOKEN in .git/config, where any later step
          # can read it. zizmor reports the default as a finding.
          persist-credentials: false

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: ${{ inputs.filters }}
          list-files: none
