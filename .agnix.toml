# agnix 0.52.2 configuration for the OMP plugin source tree.
# Keep the generic validator active; carve out only OMP-owned paths and fields
# that have no agnix platform equivalent.
severity = "Warning"
exclude = [
  "node_modules/**",
  ".git/**",
  "dist/**",
  "target/**",
  ".apm/**",
  "**/.apm/**",
  ".agents/**",
  "**/.agents/**",
  ".omp-plugin/**",
  "**/.omp-plugin/**",
  ".beads/**",
]

[rules]
# Keep all categories enabled. The overrides below are path-scoped exceptions,
# not a global opt-out from frontmatter, references, or skill validation.
disabled_rules = []
disabled_validators = []

# OMP agents use OMP model aliases and tool names, plus native routing metadata
# (advisor, spawns, thinking-level, and autoloadSkills). These fields are not
# Claude Code agent schema, so only the corresponding Claude checks are carved
# out on OMP agent files.
[[overrides]]
paths = ["agents/*.md", "**/agents/*.md"]
disabled_rules = ["CC-AG-003", "CC-AG-009", "CC-AG-010", "CC-AG-019"]

# Literal CLI/template placeholders reported as unclosed XML by agnix 0.52.2.
[[overrides]]
paths = [
  "beads/rules/beads-audit.md",
  "beads/rules/beads-setup.md",
  "chezmoi/skills/chezmoi-editor/references/conventions.md",
  "design/skills/design-md/SKILL.md",
  "design/skills/design-overview/SKILL.md",
  "project/skills/journey-consolidate/SKILL.md",
  "project/skills/journey-init/templates/FORMAT.md",
  "project/skills/journey-init/templates/journey.template.md",
  "project/skills/journey-init/templates/run.template.md",
  "project/skills/journey-write/SKILL.md",
  "quality/skills/sniff/references/languages/_template.md",
  "quality/skills/sniff/references/report-template.md",
  "speckit/rules/speckit-workflow.md",
  "whats-new/skills/whats-new/references/recipes.md",
]
disabled_rules = ["XML-001"]

# OMP infers remote transport from url; these servers do not use stdio.
[[overrides]]
paths = ["design/.mcp.json", "diagram/.mcp.json"]
disabled_rules = ["MCP-009"]

# Multiline inline-code npm package names are not Claude @file imports.
[[overrides]]
paths = [
  "design/skills/design-md/SKILL.md",
  "design/skills/design-system-audit/references/token-pipeline.md",
]
disabled_rules = ["REF-001"]

[files]
# Keep staged skill references in the generic markdown/reference pass.
include_as_generic = ["skills/*/references/**/*.md", "**/skills/*/references/**/*.md", "**/skills/*/templates/**/*.md"]
