# cad-touch: ECO-style change to a released part, with an explicit revision bump.
# Pour with product, scope, part, from_rev, to_rev, decision, and change vars.
# Revised parts and recheck cases fan out as bonded molecules; each batch ends in one lead integration and one gate.
formula = "cad-touch"
description = "ECO-style released-part change for {{product}} / {{part}}: record impact, bump revision, recheck affected design, and release"
type = "workflow"

[vars.product]
required = true
description = "hardware product id"

[vars.scope]
required = true
description = "hardware project paths this change may affect"

[vars.part]
required = true
pattern = "^[A-Z]{2,5}-[0-9]{4}$"
description = "released part number"

[vars.from_rev]
required = true
pattern = "^[A-HJ-NPRTUVWY]$"
description = "current released revision of the part"

[vars.to_rev]
required = true
pattern = "^[A-HJ-NPRTUVWY]$"
description = "next valid released revision; must be the immediate revision successor"

[vars.decision]
required = true
pattern = "^DR-[0-9]{3}$"
description = "design-record decision entry used as the ECO change record"

[vars.change]
required = true
description = "approved requested change and reason"

[vars.kernel]
default = "cadquery"
pattern = "^(cadquery|build123d)$"
description = "modeling kernel environment; keep the two kernel environments separate"

[vars.process_default]
default = "fdm"
pattern = "^(fdm|cnc)$"
description = "default manufacturing process"

[[steps]]
id = "eco-impact"
title = "Record ECO {{decision}} and impact for {{part}}"
type = "task"
priority = 1
labels = ["cad", "phase:eco"]
description = "Run skill://cad-record and skill://cad-recheck on the released baseline for {{product}}. Record {{change}} as decisions/{{decision}}. Identify the changed part and only its affected dependents from assembly/interfaces/BOM; state the baseline {{from_rev}} and proposed immediate successor {{to_rev}}. This is a released design after LAYOUT and DESIGN freeze. Before an existing record is changed, read cad-record/references/layout.md and run the read-only `validate.py PROJECT --migration-plan`; layout findings are sticky once frozen or released. Never rerun or reopen unaffected parts."

[steps.metadata]
skill_hints = "cad-record, cad-recheck, cad-flow"

[[steps]]
id = "intent-gate"
title = "INTENT gate: approve ECO {{decision}}"
type = "task"
needs = ["eco-impact"]
labels = ["cad", "phase:gate"]
description = "Present the ECO rationale, changed part, impact set, and proposed revision bump. Obtain explicit approval of this intent and its affected-part/dependent set. Do not treat the original release or a recommendation as consent. Only bd gate resolve closes this human gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "revise-fanout"
title = "Fan out one revision molecule per part in the ECO {{decision}} impact set"
type = "task"
needs = ["intent-gate"]
labels = ["cad", "phase:eco", "fanout"]
description = "Bond one mol-cad-detail per part in the approved impact set onto this step before dispatch, with the full command shown above. {{part}} goes from {{from_rev}} to {{to_rev}}, the immediate successor under the design-record revision sequence; an impacted dependent bumps only when its geometry changes. Keep unaffected part files and revisions unchanged. Run `validate.py PROJECT --migration-plan` before planning legacy paths; workers deliver only canonical record sources for authorized parts via scratch.py. Dispatch every ready subagent step below this step in ONE parallel batch of cad-part-designer workers, as skill://cad-flow Delegation describes. Close each molecule from its worker's report; close this step when every child is closed."

[steps.metadata]
skill_hints = "cad-flow, cad-record"

[[steps]]
id = "revise-integrate"
title = "Integrate the revised parts for ECO {{decision}} and build one version"
type = "task"
needs = ["revise-fanout"]
waits_for = "all-children"
labels = ["cad", "phase:eco", "phase:parts"]
description = "Accept a delivery only with its passing F3 scratch build and the revision the brief named. Decide every proposal and apply accepted ones to shared records. Commit one batch: cad-model run, check, render, form_check at F3, and recheck. Use cad-drawings to draft, review and publish version-bound drawings; follow its documented output options and cad-record's layout API. Do not write release inventories or place explicit outputs outside `.cad-work/`. Record the decision/design entry and bead note."

[steps.metadata]
skill_hints = "cad-model, cad-design, cad-drawings, cad-render, cad-record"

[[steps]]
id = "revision-gate"
title = "REVISION gate: approve the revised parts for ECO {{decision}}"
type = "task"
needs = ["revise-integrate"]
labels = ["cad", "phase:gate"]
description = "Present the revised parts, their revisions, renders, check and F3 form results, and drawings, each file as an absolute path on its own line, plus the viewer URL when it runs. Ask the user to approve the revision or name changes. Only bd gate resolve after explicit approval closes this human gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "analysis-fanout"
title = "Fan out the L3-L4 recheck cases for the ECO impact set"
type = "task"
needs = ["revision-gate"]
labels = ["cad", "phase:analysis", "fanout"]
description = "List analysis cases covering {{part}} or an impacted dependent. Bond independent cases first; an FEA case using the sweep waits for the sweep molecule. Analysts read the selected version snapshot and publish versioned evidence bundles by default; scratch overrides are new paths under `.cad-work/` only. See cad-record/references/layout.md and each producer's skill for its CLI. Close each molecule from its worker's report and this step when every child is closed."

[steps.metadata]
skill_hints = "cad-flow, cad-motion, cad-analysis"

[[steps]]
id = "analysis-integrate"
title = "Record the ECO recheck evidence for the impact set"
type = "task"
needs = ["analysis-fanout"]
waits_for = "all-children"
labels = ["cad", "phase:detail", "phase:analysis"]
description = "Check each case's inputs and warnings, then update verification.csv and the ECO record yourself for {{part}} and affected dependents only, tied to version vN. Recheck the affected design with skill://cad-recheck; preserve evidence for untouched parts. An edit after freeze must use an approved ECO, a new built version, and a re-freeze before release. A failed case blocks the gate."

[steps.metadata]
skill_hints = "cad-analysis, cad-recheck, cad-bom, cad-record"

[[steps]]
id = "analysis-gate"
title = "ANALYSIS gate for ECO {{decision}}"
type = "task"
needs = ["analysis-integrate"]
labels = ["cad", "phase:gate"]
description = "Present each case's verdict and key numbers and the updated verification rows for the impact set, each result file as an absolute path on its own line. Ask the user to approve the recheck or name changes. Only bd gate resolve after explicit approval closes this human gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "mech-critique"
title = "CRITIQUE ECO mechanical change"
type = "task"
needs = ["analysis-gate"]
labels = ["cad", "phase:critique"]
description = "Spawn cad-mech-reviewer read-only in the SAME parallel batch as dfm-critique. Review the delta, load paths, interfaces, tolerances, failure modes, and changed verification evidence only. Return PASS, MINOR, or MAJOR with named evidence; do not edit files or ask the user."

[steps.metadata]
skill_hints = "cad-review-mech"
execution_agent_type = "cad-mech-reviewer"
execution_mode = "subagent"

[[steps]]
id = "dfm-critique"
title = "CRITIQUE ECO manufacturability"
type = "task"
needs = ["analysis-gate"]
labels = ["cad", "phase:critique"]
description = "Spawn cad-dfm-reviewer read-only in the SAME parallel batch as mech-critique. Review only affected parts: process, access, stock/tool access, tolerances, material, finish, and drawing. Return PASS, MINOR, or MAJOR with named evidence; do not edit files or ask the user."

[steps.metadata]
skill_hints = "cad-review-dfm"
execution_agent_type = "cad-dfm-reviewer"
execution_mode = "subagent"

[[steps]]
id = "reconcile"
title = "Reconcile ECO findings and update release records"
type = "task"
needs = ["mech-critique", "dfm-critique"]
labels = ["cad", "phase:reconcile"]
description = "Reconcile both critiques against the ECO delta and test evidence. Resolve reproducible MAJOR and agreed MINOR findings; report unreproduced findings. Update BOM and verification records for affected parts only, preserve unaffected release evidence, and record the final disposition in decisions/{{decision}}."

[steps.metadata]
skill_hints = "cad-record, cad-bom, cad-recheck"

[[steps]]
id = "release-package"
title = "Assemble and validate ECO release {{to_rev}}"
type = "task"
needs = ["reconcile"]
labels = ["cad", "phase:release"]
description = "Run `uv run --script skill://cad-record/scripts/release.py hw --rev {{to_rev}} --version <frozen-vN> --decision {{decision}}` to validate and seal the ECO release; never author an inventory or reuse a revision. Keep the frozen anchor bound to the exact new version and manifest SHA-256. A missing, stale or failed input, including any manufacturing failure, refuses; fix it, rebuild or republish, and retry. Use the cad-record layout API for all version and bundle paths. Preserve unchanged artifacts. Report print/make files, buy items with OPEN reasons, assembly steps, and checks in structured lists/tables with every referenced file on its own absolute-path line."

[steps.metadata]
skill_hints = "cad-record, cad-bom, cad-drawings"

[[steps]]
id = "release-gate"
title = "RELEASE gate: approve ECO {{decision}}"
type = "task"
needs = ["release-package"]
labels = ["cad", "phase:gate"]
description = "Present the ECO record, immediate revision bump, impact set, revised artifacts, plus structured lists or tables of print/make files, buy items including OPEN identities and reasons, assembly steps, and checks. Give every referenced file on its own absolute-path line. Obtain explicit user approval to release the change; leave unresolved otherwise. Only bd gate resolve closes this human gate."

[steps.gate]
type = "human"
timeout = "72h"
