# cad-touch: ECO-style change to a released part, with an explicit revision bump.
# Pour with product, scope, part, from_rev, to_rev, decision, and change vars.
# Revised parts and recheck cases fan out as bonded molecules; each batch ends in one lead integration and one gate.
formula = "cad-touch"
description = "ECO-style released-part change for {{product}} / {{part}}: record impact, bump revision, recheck affected design, and release"
type = "workflow"

[vars.product]
required = true
description = "hardware product id"

[vars.scope]
required = true
description = "hardware project paths this change may affect"

[vars.part]
required = true
pattern = "^[A-Z]{2,5}-[0-9]{4}$"
description = "released part number"

[vars.from_rev]
required = true
pattern = "^[A-HJ-NPRTUVWY]$"
description = "current released revision of the part"

[vars.to_rev]
required = true
pattern = "^[A-HJ-NPRTUVWY]$"
description = "next valid released revision; must be the immediate revision successor"

[vars.decision]
required = true
pattern = "^DR-[0-9]{3}$"
description = "design-record decision entry used as the ECO change record"

[vars.change]
required = true
description = "approved requested change and reason"

[vars.kernel]
default = "cadquery"
pattern = "^(cadquery|build123d)$"
description = "modeling kernel environment; keep the two kernel environments separate"

[vars.process_default]
default = "fdm"
pattern = "^(fdm|cnc)$"
description = "default manufacturing process"

[[steps]]
id = "eco-impact"
title = "Record ECO {{decision}} and impact for {{part}}"
type = "task"
priority = 1
labels = ["cad", "phase:eco"]
description = "Run skill://cad-record and skill://cad-recheck on the released baseline for {{product}}. Record {{change}} as decisions/{{decision}}. Identify the changed part and only its affected dependents from assembly/interfaces/BOM; state the baseline {{from_rev}} and proposed immediate successor {{to_rev}}. This is a released design after LAYOUT and DESIGN freeze, so never rerun or reopen unaffected parts."

[steps.metadata]
skill_hints = "cad-record, cad-recheck, cad-flow"

[[steps]]
id = "intent-gate"
title = "INTENT gate: approve ECO {{decision}}"
type = "task"
needs = ["eco-impact"]
labels = ["cad", "phase:gate"]
description = "Present the ECO rationale, changed part, impact set, and proposed revision bump. Obtain explicit approval of this intent and its affected-part/dependent set. Do not treat the original release or a recommendation as consent. Only bd gate resolve closes this human gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "revise-fanout"
title = "Fan out one revision molecule per part in the ECO {{decision}} impact set"
type = "task"
needs = ["intent-gate"]
labels = ["cad", "phase:eco", "fanout"]
description = "Bond one mol-cad-detail per part in the approved impact set onto this step before dispatch: `bd mol bond mol-cad-detail <this-step> --type parallel --ref detail-<PN> --var product={{product}} --var scope={{scope}} --var part=<PN> --var kernel={{kernel}} --var process_default={{process_default}} --var change='ECO {{decision}}: <change for this part>; set rev <next rev>'`. {{part}} goes from {{from_rev}} to {{to_rev}}, the immediate successor under the design-record rev sequence; an impacted dependent bumps to its own immediate successor only when its geometry changes. Keep unaffected part files and revisions unchanged. Dispatch every ready subagent step below this step in ONE parallel batch of cad-part-designer workers, as skill://cad-flow Delegation describes. Close each molecule's steps and root from its worker's report; dispatch a failed part again in the next batch. Close this step when every child is closed."

[steps.metadata]
skill_hints = "cad-flow, cad-record"

[[steps]]
id = "revise-integrate"
title = "Integrate the revised parts for ECO {{decision}} and build one version"
type = "task"
needs = ["revise-fanout"]
waits_for = "all-children"
labels = ["cad", "phase:eco", "phase:parts"]
description = "Accept a delivery only with its passing F3 scratch build and the revision the brief named. Decide every proposal and apply the accepted ones to the shared records yourself. Commit one batch: `uv run --script skill://cad-flow/scripts/run.py cad-model/scripts/cad_model.py run hw --label vN --kernel {{kernel}}`, then `uv run --script skill://cad-flow/scripts/run.py cad-model/scripts/cad_model.py check vN --hw hw [--out FILE]`; press fits declared in `hw/interfaces.yaml` are automatically allowed and a blocking check failure stops the batch. Render with `uv run --script skill://cad-flow/scripts/run.py cad-render/scripts/render.py hw --version vN`, run `uv run --script skill://cad-flow/scripts/run.py cad-design/scripts/form_check.py --hw hw --parts-dir hw/versions/vN/parts --fidelity F3`, and generate each revised part's drawing from vN with `uv run --script skill://cad-flow/scripts/run.py cad-drawings/scripts/drawing.py hw/versions/vN/parts/<PN>.step --part hw/parts/<PN>/part.yaml --product hw/product.yaml --metrics hw/versions/vN/metrics.json --output-dir <dir> [--scale <ratio>]`. Commit the decision/design-record entry and bead note."

[steps.metadata]
skill_hints = "cad-model, cad-design, cad-drawings, cad-render, cad-record"

[[steps]]
id = "revision-gate"
title = "REVISION gate: approve the revised parts for ECO {{decision}}"
type = "task"
needs = ["revise-integrate"]
labels = ["cad", "phase:gate"]
description = "Present the revised parts, their revisions, renders, check and F3 form results, and drawings, each file as an absolute path on its own line, plus the viewer URL when it runs. Ask the user to approve the revision or name changes. Only bd gate resolve after explicit approval closes this human gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "analysis-fanout"
title = "Fan out the L3-L4 recheck cases for the ECO impact set"
type = "task"
needs = ["revision-gate"]
labels = ["cad", "phase:analysis", "fanout"]
description = "List the analysis cases that cover {{part}} or an impacted dependent: the joint sweep, the FreeCAD assembly check, tolerance stack-ups, and static FEA. Bond each case that needs no other case's output onto this step before dispatch: `bd mol bond mol-cad-analysis <this-step> --type parallel --ref analysis-<case> --var product={{product}} --var scope={{scope}} --var case=<id> --var kind=sweep|assembly|stackup|fea --var version=vN`. Dispatch every ready subagent step below this step in ONE parallel batch of cad-analyst workers, as skill://cad-flow Delegation describes. An FEA case at the worst-case pose sets `evidence:` to the sweep's `worst.step.json`, so it waits for the sweep molecule, then runs as the next batch. Close each molecule from its worker's report. Close this step when every child is closed."

[steps.metadata]
skill_hints = "cad-flow, cad-motion, cad-analysis"

[[steps]]
id = "analysis-integrate"
title = "Record the ECO recheck evidence for the impact set"
type = "task"
needs = ["analysis-fanout"]
waits_for = "all-children"
labels = ["cad", "phase:detail", "phase:analysis"]
description = "Check each case's inputs and warnings, then update verification.csv and the ECO record yourself for {{part}} and affected dependents only, tied to version vN. Recheck detail, fits, fasteners, process rules, drawings, BOM, interference, clearance, stack-up, kinematics, and static FEA for the impact set with skill://cad-recheck; preserve evidence for untouched parts. A failed case blocks the gate."

[steps.metadata]
skill_hints = "cad-analysis, cad-recheck, cad-bom, cad-record"

[[steps]]
id = "analysis-gate"
title = "ANALYSIS gate for ECO {{decision}}"
type = "task"
needs = ["analysis-integrate"]
labels = ["cad", "phase:gate"]
description = "Present each case's verdict and key numbers and the updated verification rows for the impact set, each result file as an absolute path on its own line. Ask the user to approve the recheck or name changes. Only bd gate resolve after explicit approval closes this human gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "mech-critique"
title = "CRITIQUE ECO mechanical change"
type = "task"
needs = ["analysis-gate"]
labels = ["cad", "phase:critique"]
description = "Spawn cad-mech-reviewer read-only in the SAME parallel batch as dfm-critique. Review the delta, load paths, interfaces, tolerances, failure modes, and changed verification evidence only. Return PASS, MINOR, or MAJOR with named evidence; do not edit files or ask the user."

[steps.metadata]
skill_hints = "cad-review-mech"
execution_agent_type = "cad-mech-reviewer"
execution_mode = "subagent"

[[steps]]
id = "dfm-critique"
title = "CRITIQUE ECO manufacturability"
type = "task"
needs = ["analysis-gate"]
labels = ["cad", "phase:critique"]
description = "Spawn cad-dfm-reviewer read-only in the SAME parallel batch as mech-critique. Review only affected parts: process, access, stock/tool access, tolerances, material, finish, and drawing. Return PASS, MINOR, or MAJOR with named evidence; do not edit files or ask the user."

[steps.metadata]
skill_hints = "cad-review-dfm"
execution_agent_type = "cad-dfm-reviewer"
execution_mode = "subagent"

[[steps]]
id = "reconcile"
title = "Reconcile ECO findings and update release records"
type = "task"
needs = ["mech-critique", "dfm-critique"]
labels = ["cad", "phase:reconcile"]
description = "Reconcile both critiques against the ECO delta and test evidence. Resolve reproducible MAJOR and agreed MINOR findings; report unreproduced findings. Update BOM and verification records for affected parts only, preserve unaffected release evidence, and record the final disposition in decisions/{{decision}}."

[steps.metadata]
skill_hints = "cad-record, cad-bom, cad-recheck"

[[steps]]
id = "release-package"
title = "Assemble and validate ECO release {{to_rev}}"
type = "task"
needs = ["reconcile"]
labels = ["cad", "phase:release"]
description = "Run skill://cad-record, skill://cad-bom, and skill://cad-drawings to update the release manifest, STEP AP242, drawings, EBOM, verification matrix, and docs for the affected revision/dependent set. For drawings use `uv run --script skill://cad-flow/scripts/run.py cad-drawings/scripts/drawing.py hw/versions/vN/parts/<PN>.step --part hw/parts/<PN>/part.yaml --product hw/product.yaml --metrics hw/versions/vN/metrics.json --output-dir <dir> [--scale <ratio>]`. Preserve unchanged artifacts. Validate the revision transition {{from_rev}} -> {{to_rev}}, ECO decision {{decision}}, and release evidence. Use FreeCAD 1.1.4 only. No slicer, CAM, or machine tooling."

[steps.metadata]
skill_hints = "cad-record, cad-bom, cad-drawings"

[[steps]]
id = "release-gate"
title = "RELEASE gate: approve ECO {{decision}}"
type = "task"
needs = ["release-package"]
labels = ["cad", "phase:gate"]
description = "Present the ECO record, immediate revision bump, impact set, revised artifacts, and validation. Obtain explicit user approval to release the change; leave unresolved otherwise. Only bd gate resolve closes this human gate."

[steps.gate]
type = "human"
timeout = "72h"
