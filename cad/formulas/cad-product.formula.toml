# cad-product: multi-part product flow; the lead orchestrates and every independent unit is a bonded molecule.
# Pour with --var product=<id> --var scope=<paths>; kernel/process defaults are cadquery/fdm.
# Each *-fanout step bonds one molecule per unit in one batch; its *-integrate step waits for all of them,
# then one human gate closes the stage. skill://cad-flow lists the units, agents, and ownership per stage.
formula = "cad-product"
description = "Full multi-part CAD flow for {{product}} in {{scope}}: parallel worker batches per stage, one lead integration and one gate per stage, through validated release"
type = "workflow"

[vars.product]
required = true
description = "hardware product id recorded in hw/product.yaml"

[vars.scope]
required = true
description = "hardware project paths this workflow may change"

[vars.kernel]
default = "cadquery"
pattern = "^(cadquery|build123d)$"
description = "modeling kernel environment; CadQuery 2.8 and build123d 0.13 run separately"

[vars.process_default]
default = "fdm"
pattern = "^(fdm|cnc)$"
description = "default manufacturing process; parts may override it"

[[steps]]
id = "ground"
title = "GROUND product, constraints, and existing records"
type = "task"
priority = 1
labels = ["cad", "phase:ground"]
description = "Run skill://cad-flow and skill://cad-record. Validate {{scope}} with `uv run --script skill://cad-record/scripts/validate.py {{scope}}`. Establish product context, requirements, loads, environment, interfaces, units, rigor, regime, and record gaps. Draft and preview live; collect user feedback. On 'commit', record the design entry and bead note. For each L1-L4 batch, run cad-model run then cad-model check; stop on a blocking failure. Render the same version. Recheck from the layout threshold, user commit, or pre-commit hook, scoped to changed parts and dependents via flow.recheck_from."

[steps.metadata]
skill_hints = "cad-flow, cad-record"

[[steps]]
id = "intent-gate"
title = "INTENT gate for {{product}}"
type = "task"
needs = ["ground"]
labels = ["cad", "phase:gate"]
description = "Present GROUND findings and numbered questions with recommended answers. Confirm function, use, loads, environment, safety, interfaces, deliverables, rigor, ISO/ASME regime, kernel {{kernel}}, and default process {{process_default}}. Record approved intent and explicit constraints. No recommendation is consent; only bd gate resolve after user approval closes this gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "specify"
title = "SPECIFY requirements, interfaces, and verification"
type = "task"
needs = ["intent-gate"]
labels = ["cad", "phase:specify"]
description = "Use skill://cad-record to write traceable REQ-### entries with rationale, source, priority, verification method and criteria. Capture interface contracts, limits, constraints, and measurable acceptance conditions before concept modeling. Follow the stage loop in skill://cad-flow."

[steps.metadata]
skill_hints = "cad-record, cad-flow"

[[steps]]
id = "concept-fanout"
title = "L0 CONCEPT: fan out one variant molecule per concept"
type = "task"
needs = ["specify"]
labels = ["cad", "phase:concept", "fanout"]
description = "Choose 2-4 distinct answers to the main trade-off and one shared node-id vocabulary. Bond one mol-cad-variant per variant onto this step, all before dispatch: `bd mol bond mol-cad-variant <this-step> --type parallel --ref variant-<id> --var product={{product}} --var scope={{scope}} --var variant=<id> --var tradeoff='<answer>'`. Dispatch every ready subagent step below this step in ONE parallel batch, one cad-concept-designer per variant, as skill://cad-flow Delegation describes. Close each molecule's step and root from its worker's report; dispatch a failed variant again in the next batch. Close this step when every child is closed."

[steps.metadata]
skill_hints = "cad-flow, cad-concept"

[[steps]]
id = "concept-integrate"
title = "L0 CONCEPT: merge the variants and collect feedback"
type = "task"
needs = ["concept-fanout"]
waits_for = "all-children"
labels = ["cad", "phase:concept"]
description = "Merge the drafted variants into `hw/concept/<product-id>.scene.json`, keeping their ids. Check it with `uv run --script skill://cad-concept/scripts/concept.py check <scene>` and serve the live preview with `uv run --script skill://cad-concept/scripts/serve.py --scene-dir hw/concept --port 8765`. Gather feedback; refine, merge, or drop as directed, or bond mol-cad-concept onto the VARIANT gate for a further worker round. Before LAYOUT freeze, concept commit batches save screenshots and defer the broader recheck. Record candidates and feedback."

[steps.metadata]
skill_hints = "cad-concept, cad-flow"
execution_mode = "interactive"

[[steps]]
id = "variant-gate"
title = "VARIANT gate: select or refine a concept"
type = "task"
needs = ["concept-integrate"]
labels = ["cad", "phase:gate"]
description = "Present 2-4 rendered variants and their tradeoffs. Ask the user to select a variant, request a further concept round, or specify a merge/drop. Only explicit selection or direction resolves the gate; only bd gate resolve closes it."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "layout"
title = "L1 LAYOUT: labelled subassemblies, interfaces, joints, and BOM skeleton"
type = "task"
needs = ["variant-gate"]
labels = ["cad", "phase:layout"]
description = "Run skill://cad-model and skill://cad-record. After explicit VARIANT selection, export the chosen concept with `uv run --script skill://cad-concept/scripts/concept.py handoff <scene> --out hw/concept/handoff.json`. Define labelled subassemblies, part references, envelopes, datums, interface contracts, joints and travel limits, and EBOM skeleton with make/buy per part. Commit each L1 batch with `uv run --script skill://cad-model/scripts/cad_model.py run hw --label vN --kernel {{kernel}}`, then `uv run --script skill://cad-model/scripts/cad_model.py check vN --hw hw [--out FILE]`; press fits declared in `hw/interfaces.yaml` are automatically allowed and a blocking failure stops the batch. Then render the version. Before LAYOUT freeze, defer the broader recheck; after freeze, recheck changed parts and dependents with this stage's and all earlier stages' checks."

[steps.metadata]
skill_hints = "cad-model, cad-record, cad-flow"

[[steps]]
id = "layout-freeze-gate"
title = "LAYOUT freeze gate"
type = "task"
needs = ["layout"]
labels = ["cad", "phase:gate"]
description = "Present labelled subassemblies, envelopes, interfaces, joints and limits, and BOM skeleton. Ask the user to freeze the layout explicitly. After this point, a commit batch rechecks changed parts plus their dependents, running the current stage checks and every earlier stage's checks. Only bd gate resolve closes the gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "parts-fanout"
title = "L2 PARTS: fan out one part molecule per subassembly and one sourcing molecule per purchased family"
type = "task"
needs = ["layout-freeze-gate"]
labels = ["cad", "phase:parts", "fanout"]
description = "Read the subassemblies from hw/assembly.yaml and the purchased families from hw/bom.csv (make_buy buy). Bond them all onto this step before dispatch: one `bd mol bond mol-cad-part <this-step> --type parallel --ref part-<subassembly> --var product={{product}} --var scope={{scope}} --var subassembly=<id> --var change='<change for this unit>' --var kernel={{kernel}} --var process_default={{process_default}}` per subassembly, and one `bd mol bond mol-cad-sourcing <this-step> --type parallel --ref source-<family> --var product={{product}} --var scope={{scope}} --var family=<id> --var parts=<PN,PN>` per family. Assign every PN to exactly one part unit. Dispatch every ready subagent step below this step in ONE parallel batch (cad-part-designer, cad-sourcing-researcher), as skill://cad-flow Delegation describes. Close each molecule's steps and root from its worker's report; dispatch a failed unit again in the next batch. Close this step when every child is closed."

[steps.metadata]
skill_hints = "cad-flow"

[[steps]]
id = "parts-integrate"
title = "L2 PARTS: integrate the delivered parts and build one version"
type = "task"
needs = ["parts-fanout"]
waits_for = "all-children"
labels = ["cad", "phase:parts"]
description = "Accept a part delivery only with its passing scratch build. Decide every proposal and sourcing finding, apply the accepted ones to the shared records yourself, and record the rest as declined. Then commit one batch for the whole product: `uv run --script skill://cad-model/scripts/cad_model.py run hw --label vN --kernel {{kernel}}`, then `uv run --script skill://cad-model/scripts/cad_model.py check vN --hw hw [--out FILE]`; a blocking failure stops the batch. Run `uv run --script skill://cad-design/scripts/form_check.py --hw hw --parts-dir hw/versions/vN/parts --fidelity F2`; every made part needs F2. Render with `uv run --script skill://cad-render/scripts/render.py hw --version vN` and inspect with cad-viewer. Run skill://cad-recheck for the changed parts and dependents. Record the design entry and bead note."

[steps.metadata]
skill_hints = "cad-model, cad-design, cad-render, cad-viewer, cad-recheck, cad-record"

[[steps]]
id = "parts-gate"
title = "PARTS gate for {{product}}"
type = "task"
needs = ["parts-integrate"]
labels = ["cad", "phase:gate"]
description = "Present the integrated version: renders, check and form results, sourcing decisions, and declined proposals, each file as an absolute path on its own line, plus the viewer URL when it runs. Ask the user to approve the parts or name changes. Only bd gate resolve after explicit approval closes this gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "detail-fanout"
title = "L3 DETAIL: fan out one detail molecule per made part"
type = "task"
needs = ["parts-gate"]
labels = ["cad", "phase:detail", "fanout"]
description = "Bond one mol-cad-detail per made part onto this step before dispatch: `bd mol bond mol-cad-detail <this-step> --type parallel --ref detail-<PN> --var product={{product}} --var scope={{scope}} --var part=<PN> --var change='<detail for this part>' --var kernel={{kernel}} --var process_default={{process_default}}`. Dispatch every ready subagent step below this step in ONE parallel batch of cad-part-designer workers, as skill://cad-flow Delegation describes. Close each molecule's steps and root from its worker's report; dispatch a failed part again in the next batch. Close this step when every child is closed."

[steps.metadata]
skill_hints = "cad-flow"

[[steps]]
id = "detail-integrate"
title = "L3 DETAIL: integrate the detailed parts, build one version, and draw it"
type = "task"
needs = ["detail-fanout"]
waits_for = "all-children"
labels = ["cad", "phase:detail"]
description = "Accept a delivery only with its passing F3 scratch build. Decide every fit, interface, and limit proposal and apply the accepted ones to hw/interfaces.yaml and the other shared records yourself. Commit one batch: cad-model run then check (a blocking failure stops it), `uv run --script skill://cad-design/scripts/form_check.py --hw hw --parts-dir hw/versions/vN/parts --fidelity F3` (every made part needs F3), and the render. Generate each detailed part's drawing from this version with `uv run --script skill://cad-drawings/scripts/drawing.py hw/versions/vN/parts/<PN>.step --part hw/parts/<PN>/part.yaml --product hw/product.yaml --metrics hw/versions/vN/metrics.json --output-dir <dir> [--scale <ratio>]`. Recheck changed parts and dependents with skill://cad-recheck. Record the design entry and bead note."

[steps.metadata]
skill_hints = "cad-fits, cad-drawings, cad-design, cad-recheck, cad-record, cad-flow"

[[steps]]
id = "detail-gate"
title = "DETAIL gate for {{product}}"
type = "task"
needs = ["detail-integrate"]
labels = ["cad", "phase:gate"]
description = "Present the integrated version's renders, F3 form results, fit decisions, and drawing previews and PDFs, each file as an absolute path on its own line, plus the viewer URL when it runs. Ask the user to approve the detail or name changes. Only bd gate resolve after explicit approval closes this gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "bom"
title = "EBOM: reconcile parts, quantities, and purchasing data"
type = "task"
needs = ["detail-gate"]
labels = ["cad", "phase:bom"]
description = "Run skill://cad-bom to reconcile subassemblies, PN/revision references, quantities, make/buy, suppliers, materials, and finishes into hw/bom.csv, using the accepted sourcing findings. Include every purchased and manufactured item. Draft and preview; on commit batch recheck changed parts/dependents at this stage and all earlier stages. Record the design-record entry and bead note."

[steps.metadata]
skill_hints = "cad-bom, cad-record, cad-recheck, cad-flow"

[[steps]]
id = "analysis-fanout"
title = "L4 ANALYSIS: fan out one analysis molecule per case"
type = "task"
needs = ["bom"]
labels = ["cad", "phase:analysis", "fanout"]
description = "Build and check the version vN that L4 analyses when the record changed since the last integrated version. List the cases: the joint sweep, the FreeCAD assembly check, each tolerance stack-up, and each static FEA case. Bond every case that needs no other case's output onto this step before dispatch: `bd mol bond mol-cad-analysis <this-step> --type parallel --ref analysis-<case> --var product={{product}} --var scope={{scope}} --var case=<id> --var kind=sweep|assembly|stackup|fea --var version=vN`. Dispatch every ready subagent step below this step in ONE parallel batch of cad-analyst workers, as skill://cad-flow Delegation describes. An FEA case at the worst-case pose needs the sweep's `worst_case`: bond and dispatch those cases as the next batch once the sweep molecule closes. Close each molecule from its worker's report. Close this step when every child is closed."

[steps.metadata]
skill_hints = "cad-flow, cad-motion, cad-analysis"

[[steps]]
id = "analysis-integrate"
title = "L4 ANALYSIS: record the verification evidence"
type = "task"
needs = ["analysis-fanout"]
waits_for = "all-children"
labels = ["cad", "phase:analysis"]
description = "Check each case's inputs, units, selectors, and solver warnings, then write the accepted verification.csv rows yourself, tied to requirements and to version vN. A failed case blocks the gate: record it, and route a design fix through a new L2 or L3 batch. Render the analysed version with `uv run --script skill://cad-render/scripts/render.py hw --version vN`. Recheck affected parts and dependents from flow.recheck_from. No slicer, CAM, or machine tooling."

[steps.metadata]
skill_hints = "cad-analysis, cad-motion, cad-record, cad-recheck, cad-flow"

[[steps]]
id = "analysis-gate"
title = "ANALYSIS gate for {{product}}"
type = "task"
needs = ["analysis-integrate"]
labels = ["cad", "phase:gate"]
description = "Present each case's verdict and key numbers, the worst-case pose, and the verification rows, each result file and render as an absolute path on its own line, plus the viewer URL when it runs. Ask the user to approve the analysis or name changes. Only bd gate resolve after explicit approval closes this gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "mech-critique"
title = "CRITIQUE mechanical soundness"
type = "task"
needs = ["analysis-gate"]
labels = ["cad", "phase:critique"]
description = "Run as a read-only subagent in the SAME parallel batch as dfm-critique. Challenge requirements, load paths, interfaces, joints, tolerances, failure modes, analysis assumptions, and evidence. Return PASS, MINOR, or MAJOR with named evidence; do not edit product files or question the user."

[steps.metadata]
skill_hints = "cad-review-mech"
execution_agent_type = "cad-mech-reviewer"
execution_mode = "subagent"

[[steps]]
id = "dfm-critique"
title = "CRITIQUE manufacturability"
type = "task"
needs = ["analysis-gate"]
labels = ["cad", "phase:critique"]
description = "Run as a read-only subagent in the SAME parallel batch as mech-critique. Review FDM or CNC process choice, geometry, access, stock, tool access, tolerances, material, finish, and drawings. Return PASS, MINOR, or MAJOR with named evidence; do not edit product files or question the user."

[steps.metadata]
skill_hints = "cad-review-dfm"
execution_agent_type = "cad-dfm-reviewer"
execution_mode = "subagent"

[[steps]]
id = "reconcile"
title = "RECONCILE mechanical and DFM findings"
type = "task"
needs = ["mech-critique", "dfm-critique"]
labels = ["cad", "phase:reconcile"]
description = "Reconcile both reports against the design record and evidence. Resolve reproducible MAJOR and agreed MINOR findings, routing part changes through a new L2 or L3 batch, and report unreproduced findings explicitly. Recheck only changed assertions with skill://cad-recheck. Record decisions and evidence."

[steps.metadata]
skill_hints = "cad-flow, cad-recheck, cad-record"

[[steps]]
id = "design-freeze-gate"
title = "DESIGN freeze gate"
type = "task"
needs = ["reconcile"]
labels = ["cad", "phase:gate"]
description = "Present the frozen candidate, all part revisions, EBOM, drawings, verification matrix, and critique verdicts. Obtain explicit user approval to freeze the design. Changes after this freeze reopen only affected parts and impacted dependents; keep all other parts frozen. Only bd gate resolve closes this gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "release-package"
title = "RELEASE: assemble and validate product package"
type = "task"
needs = ["design-freeze-gate"]
labels = ["cad", "phase:release"]
description = "Run skill://cad-record, skill://cad-bom, skill://cad-drawings, and skill://cad-analysis to assemble and validate STEP AP242, drawings, EBOM, verification, and documentation. Generate drawings with `uv run --script skill://cad-drawings/scripts/drawing.py hw/versions/vN/parts/<PN>.step --part hw/parts/<PN>/part.yaml --product hw/product.yaml --metrics hw/versions/vN/metrics.json --output-dir <dir> [--scale <ratio>]`. Static FEA command: `uv run --script skill://cad-analysis/scripts/fea_static.py <case.yaml>`. Include GitBuilding, DIN SPEC 3105-1, and Open Know-How docs. Validate records and evidence. Use FreeCAD 1.1.4 only. No slicer, CAM, or machine tooling."

[steps.metadata]
skill_hints = "cad-record, cad-bom, cad-drawings, cad-analysis"

[[steps]]
id = "release-gate"
title = "RELEASE gate for {{product}}"
type = "task"
needs = ["release-package"]
labels = ["cad", "phase:gate"]
description = "Present the validated release manifest and required artifacts, then obtain explicit user approval to release. Any failed criterion or missing artifact keeps this human gate open. Only bd gate resolve closes it."

[steps.gate]
type = "human"
timeout = "72h"
