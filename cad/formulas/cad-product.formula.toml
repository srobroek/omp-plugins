# cad-product: full product flow; each L2 subassembly bonds one parallel mol-cad-part.
# Pour with --var product=<id> --var scope=<paths>; kernel/process defaults are cadquery/fdm.
formula = "cad-product"
description = "Full multi-part CAD flow for {{product}} in {{scope}}: parallel subassembly loops from layout through validated release"
type = "workflow"

[vars.product]
required = true
description = "hardware product id recorded in hw/product.yaml"

[vars.scope]
required = true
description = "hardware project paths this workflow may change"

[vars.kernel]
default = "cadquery"
pattern = "^(cadquery|build123d)$"
description = "modeling kernel environment; CadQuery 2.8 and build123d 0.13 run separately"

[vars.process_default]
default = "fdm"
pattern = "^(fdm|cnc)$"
description = "default manufacturing process; parts may override it"

[[steps]]
id = "ground"
title = "GROUND product, constraints, and existing records"
type = "task"
priority = 1
labels = ["cad", "phase:ground"]
description = "Run skill://cad-flow and skill://cad-record over {{scope}}. Establish product context, requirements, loads, environment, existing interfaces, units, rigor, regime, and record gaps. Every stage follows DRAFT -> live preview with no checks -> user feedback; on 'commit batch', COMMIT the design-record entry and bead note. Before LAYOUT freeze commit batches build and render only. At or after LAYOUT freeze, run skill://cad-recheck on changed parts plus dependents: this stage's checks and all earlier stages' checks. Ask 'More detail?'; otherwise request the stage's human gate."

[steps.metadata]
skill_hints = "cad-flow, cad-record"

[[steps]]
id = "intent-gate"
title = "INTENT gate for {{product}}"
type = "task"
needs = ["ground"]
labels = ["cad", "phase:gate"]
description = "Present GROUND findings and numbered questions with recommended answers. Confirm function, use, loads, environment, safety, interfaces, deliverables, rigor, ISO/ASME regime, kernel {{kernel}}, and default process {{process_default}}. Record approved intent and explicit constraints. No recommendation is consent; only bd gate resolve after user approval closes this gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "specify"
title = "SPECIFY requirements, interfaces, and verification"
type = "task"
needs = ["intent-gate"]
labels = ["cad", "phase:specify"]
description = "Use skill://cad-record to write traceable REQ-### entries with rationale, source, priority, verification method and criteria. Capture interface contracts, limits, constraints, and measurable acceptance conditions before concept modeling. Follow the stage loop in skill://cad-flow."

[steps.metadata]
skill_hints = "cad-record, cad-flow"

[[steps]]
id = "concept"
title = "L0 CONCEPT: draft 2-4 three.js variants"
type = "task"
needs = ["specify"]
labels = ["cad", "phase:l0-concept"]
description = "Run skill://cad-concept to create 2-4 distinct, labelled three.js concept variants against SPECIFY. Render a live preview and gather feedback; refine, merge, or drop variants as directed. Before LAYOUT freeze, 'commit batch' builds and renders only; run no engineering checks. Record the candidate set and the feedback-driven changes."

[steps.metadata]
skill_hints = "cad-concept, cad-flow"
execution_mode = "interactive"

[[steps]]
id = "variant-gate"
title = "VARIANT gate: select or refine a concept"
type = "task"
needs = ["concept"]
labels = ["cad", "phase:gate"]
description = "Present 2-4 rendered variants and their tradeoffs. Ask the user to select a variant, request a further concept round, or specify a merge/drop. Only explicit selection or direction resolves the gate; only bd gate resolve closes it."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "layout"
title = "L1 LAYOUT: labelled subassemblies, interfaces, joints, and BOM skeleton"
type = "task"
needs = ["variant-gate"]
labels = ["cad", "phase:l1-layout"]
description = "Run skill://cad-model and skill://cad-record. Define labelled subassemblies and their part references, envelopes, datums, interface contracts, joints with type/axis/origin/min/max/nominal limits, and an EBOM skeleton. Render the layout preview; before LAYOUT freeze commit batches build and render only, with no checks."

[steps.metadata]
skill_hints = "cad-model, cad-record, cad-flow"

[[steps]]
id = "layout-freeze-gate"
title = "LAYOUT freeze gate"
type = "task"
needs = ["layout"]
labels = ["cad", "phase:gate"]
description = "Present labelled subassemblies, envelopes, interfaces, joints and limits, and BOM skeleton. Ask the user to freeze the layout explicitly. After this point, a commit batch rechecks changed parts plus their dependents, running the current stage checks and every earlier stage's checks. Only bd gate resolve closes the gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "parts-fanout"
title = "L2 PARTS: fan out one molecule per subassembly"
type = "task"
needs = ["layout-freeze-gate"]
labels = ["cad", "phase:l2-parts"]
description = "Read the subassembly list from hw/assembly.yaml and, for each distinct subassembly, bond one mol-cad-part onto this step in the SAME parallel batch using --type parallel. Pass product={{product}}, scope={{scope}}, subassembly=<recorded id>, kernel={{kernel}}, and process_default={{process_default}} on every bond; give each child a stable distinct --ref. Every child builds, checks, and records one subassembly/part loop. Keep this parent step open until all child loops finish and their evidence is recorded. Post-freeze commit batches use skill://cad-recheck on changed parts plus dependents, this stage and all earlier stage checks."

[steps.metadata]
skill_hints = "cad-flow, cad-recheck, cad-record"

[[steps]]
id = "detail"
title = "L3 DETAIL: fit, fastener, tolerance, process rules, and drawings"
type = "task"
needs = ["parts-fanout"]
labels = ["cad", "phase:l3-detail"]
description = "Run skill://cad-fits and skill://cad-drawings across the assembly. Specify fits, fasteners, tolerances, datums, and FDM/CNC rules for each affected part; create drawings. Draft, preview, and gather feedback. A committed post-freeze batch rechecks changed parts and dependents at L3 and at every earlier stage. Record the design-record changes and bead note."

[steps.metadata]
skill_hints = "cad-fits, cad-drawings, cad-recheck, cad-record, cad-flow"

[[steps]]
id = "bom"
title = "EBOM: reconcile parts, quantities, and purchasing data"
type = "task"
needs = ["detail"]
labels = ["cad", "phase:bom"]
description = "Run skill://cad-bom to reconcile subassemblies, PN/revision references, quantities, make/buy, suppliers, materials, and finishes into hw/bom.csv. Include every purchased and manufactured item. Draft and preview; on commit batch recheck changed parts/dependents at this stage and all earlier stages. Record the design-record entry and bead note."

[steps.metadata]
skill_hints = "cad-bom, cad-record, cad-recheck, cad-flow"

[[steps]]
id = "analysis"
title = "L4 ANALYSIS: assembly and worst-case verification"
type = "task"
needs = ["bom"]
labels = ["cad", "phase:l4-analysis"]
description = "Run skill://cad-analysis for interference, clearance, tolerance stack-up, kinematic sweep where applicable, and static FEA at the worst-case pose. Verify requirements with recorded assumptions and criteria. At commit batch, run skill://cad-recheck on changed parts and dependents from this stage through all earlier checks. Do not invoke slicer, CAM, or machine tooling."

[steps.metadata]
skill_hints = "cad-analysis, cad-record, cad-recheck, cad-flow"

[[steps]]
id = "mech-critique"
title = "CRITIQUE mechanical soundness"
type = "task"
needs = ["analysis"]
labels = ["cad", "phase:critique"]
description = "Run as a read-only subagent in the SAME parallel batch as dfm-critique. Challenge requirements, load paths, interfaces, joints, tolerances, failure modes, analysis assumptions, and evidence. Return PASS, MINOR, or MAJOR with named evidence; do not edit product files or question the user."

[steps.metadata]
skill_hints = "cad-review-mech"
execution_agent_type = "cad-mech-reviewer"
execution_mode = "subagent"

[[steps]]
id = "dfm-critique"
title = "CRITIQUE manufacturability"
type = "task"
needs = ["analysis"]
labels = ["cad", "phase:critique"]
description = "Run as a read-only subagent in the SAME parallel batch as mech-critique. Review FDM or CNC process choice, geometry, access, stock, tool access, tolerances, material, finish, and drawings. Return PASS, MINOR, or MAJOR with named evidence; do not edit product files or question the user."

[steps.metadata]
skill_hints = "cad-review-dfm"
execution_agent_type = "cad-dfm-reviewer"
execution_mode = "subagent"

[[steps]]
id = "reconcile"
title = "RECONCILE mechanical and DFM findings"
type = "task"
needs = ["mech-critique", "dfm-critique"]
labels = ["cad", "phase:reconcile"]
description = "Reconcile both reports against the design record and evidence. Resolve reproducible MAJOR and agreed MINOR findings, and report unreproduced findings explicitly. Recheck only changed assertions with skill://cad-recheck. Record decisions and evidence."

[steps.metadata]
skill_hints = "cad-flow, cad-recheck, cad-record"

[[steps]]
id = "design-freeze-gate"
title = "DESIGN freeze gate"
type = "task"
needs = ["reconcile"]
labels = ["cad", "phase:gate"]
description = "Present the frozen candidate, all part revisions, EBOM, drawings, verification matrix, and critique verdicts. Obtain explicit user approval to freeze the design. Changes after this freeze reopen only affected parts and impacted dependents; keep all other parts frozen. Only bd gate resolve closes this gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "release-package"
title = "RELEASE: assemble and validate product package"
type = "task"
needs = ["design-freeze-gate"]
labels = ["cad", "phase:release"]
description = "Run skill://cad-record, skill://cad-bom, skill://cad-drawings, and skill://cad-analysis to assemble and validate STEP AP242, drawings, EBOM, verification matrix, and documentation. Include a GitBuilding guide, DIN SPEC 3105-1 checklist, and Open Know-How manifest. Validate all referenced subassemblies, parts, revisions, and evidence. FreeCAD 1.1.4 is the only CAD application; exclude slicer, CAM, and machine tooling. Record hw/releases/<rev>/manifest.json."

[steps.metadata]
skill_hints = "cad-record, cad-bom, cad-drawings, cad-analysis"

[[steps]]
id = "release-gate"
title = "RELEASE gate for {{product}}"
type = "task"
needs = ["release-package"]
labels = ["cad", "phase:gate"]
description = "Present the validated release manifest and required artifacts, then obtain explicit user approval to release. Any failed criterion or missing artifact keeps this human gate open. Only bd gate resolve closes it."

[steps.gate]
type = "human"
timeout = "72h"
