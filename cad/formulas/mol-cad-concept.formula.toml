# mol-cad-concept: one additional L0 round before LAYOUT freeze.
# Bond onto the concept/VARIANT step that needs another user-directed round; its variants fan out as mol-cad-variant.
formula = "mol-cad-concept"
description = "Another L0 concept round {{round}} for {{product}}: render, refine, merge, or drop three.js variants and obtain selection"
type = "workflow"

[vars.product]
required = true
description = "hardware product id"

[vars.scope]
required = true
description = "hardware project paths this concept round may change"

[vars.round]
default = "2"
pattern = "^[2-9][0-9]*$"
description = "additional concept round number"

[vars.kernel]
default = "cadquery"
pattern = "^(cadquery|build123d)$"
description = "selected downstream modeling kernel"

[vars.process_default]
default = "fdm"
pattern = "^(fdm|cnc)$"
description = "default manufacturing process"

[[steps]]
id = "round-fanout"
title = "L0 concept round {{round}}: fan out one variant molecule per new or reworked variant"
type = "task"
labels = ["cad", "phase:concept", "fanout"]
description = "Read the current scene, requirements, and feedback. For each variant the user asked to add or rework in round {{round}}, bond one mol-cad-variant onto this step before dispatch: `bd mol bond mol-cad-variant <this-step> --type parallel --ref variant-<id> --var product={{product}} --var scope={{scope}} --var variant=<id> --var tradeoff='<answer>'`. Keep at most 4 live variants. Dispatch every ready subagent step below this step in ONE parallel batch of cad-concept-designer workers, as skill://cad-flow Delegation describes. Close each molecule's step and root from its worker's report. Close this step when every child is closed."

[steps.metadata]
skill_hints = "cad-flow, cad-concept"

[[steps]]
id = "round-integrate"
title = "L0 concept round {{round}}: merge the variants and collect feedback"
type = "task"
needs = ["round-fanout"]
waits_for = "all-children"
labels = ["cad", "phase:concept"]
description = "Merge the drafted variants into `hw/concept/<product-id>.scene.json`, retiring replaced variants with a reason. Check each edit with `uv run --script skill://cad-concept/scripts/concept.py check <scene>`. Serve the preview as a background job with `uv run --script skill://cad-concept/scripts/serve.py --scene-dir hw/concept`, send the user the `url` from its first stdout line, and stop it as skill://cad-concept describes once the user is done. After feedback, refine, merge, or drop as directed. On commit, check and save one screenshot per live variant. Before LAYOUT freeze, concept commit batches defer the broader recheck. Record the design entry and bead note."

[steps.metadata]
skill_hints = "cad-concept, cad-flow, cad-record"
execution_mode = "interactive"

[[steps]]
id = "variant-gate"
title = "VARIANT gate for concept round {{round}}"
type = "task"
needs = ["round-integrate"]
labels = ["cad", "phase:gate"]
description = "Present the round {{round}} variants and the cumulative refine/merge/drop history. Obtain explicit user selection or another direction. Recommendations do not resolve the gate; only bd gate resolve closes it."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "record-variant"
title = "COMMIT selected variant round {{round}}"
type = "task"
needs = ["variant-gate"]
labels = ["cad", "phase:concept"]
description = "Record the selected concept id, user direction, variant disposition, and preview location in the design record and bead note. Export the chosen concept using cad-concept's documented output override at a new path under `.cad-work/`; never write into a managed layout path directly. Keep LAYOUT unfrozen until its separate human gate. Concept approval does not run engineering checks."

[steps.metadata]
skill_hints = "cad-record, cad-flow"
