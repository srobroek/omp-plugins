# cad-part: full prototype-to-release workflow for a one-part product.
# Pour with --var product=<id> --var scope=<paths>; kernel defaults to cadquery.
# Each *-fanout step bonds one molecule per unit in one batch; its *-integrate step waits for all of them,
# then one human gate closes the stage. skill://cad-flow lists the units, agents, and ownership per stage.
formula = "cad-part"
description = "Full single-part CAD flow for {{product}} in {{scope}}: worker batches for concept, part, sourcing, detail, and analysis, one lead integration and one gate per stage, through release"
type = "workflow"

[vars.product]
required = true
description = "hardware product id recorded in hw/product.yaml"

[vars.scope]
required = true
description = "hardware project paths this workflow may change"

[vars.kernel]
default = "cadquery"
pattern = "^(cadquery|build123d)$"
description = "modeling kernel environment; CadQuery 2.8 and build123d 0.13 run in separate environments"

[vars.process_default]
default = "fdm"
pattern = "^(fdm|cnc)$"
description = "default manufacturing process; each part may override it"

[[steps]]
id = "ground"
title = "GROUND the product and existing design record"
type = "task"
priority = 1
labels = ["cad", "phase:ground"]
description = "Run skill://cad-flow and skill://cad-record over {{scope}}. Establish product context, requirements, units, rigor, regime, constraints, and record gaps from the existing hw/ files. For each stage, draft, preview live, and gather user feedback; on 'commit batch', commit the design-record entry and bead note. For each L1 to L4 batch, run cad-model run, then cad-model check (a blocking failure stops the batch), then cad-render for the same version. Before LAYOUT freeze, defer the broader recheck; at or after LAYOUT freeze, run skill://cad-recheck on changed parts plus dependents with this stage's checks and every earlier stage's checks. Ask 'More detail?'; otherwise request that stage's human gate."

[steps.metadata]
skill_hints = "cad-flow, cad-record"

[[steps]]
id = "intent-gate"
title = "INTENT gate for {{product}}"
type = "task"
needs = ["ground"]
labels = ["cad", "phase:gate"]
description = "Present the GROUND findings and numbered questions with recommended answers. Confirm intended function, loads, environment, interfaces, use, safety, deliverables, rigor, ISO/ASME regime, kernel {{kernel}}, and default process {{process_default}}. Record answers in the design record. No recommendation is consent; keep this gate open without explicit user approval. Only bd gate resolve closes it."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "specify"
title = "SPECIFY requirements and verification"
type = "task"
needs = ["intent-gate"]
labels = ["cad", "phase:specify"]
description = "Run skill://cad-record. Write traceable REQ-### entries with rationale, source, priority, verification method and criteria; define interfaces and measurable acceptance conditions. Record the approved design intent before modeling. Follow the stage loop in skill://cad-flow."

[steps.metadata]
skill_hints = "cad-record, cad-flow"

[[steps]]
id = "concept-fanout"
title = "L0 CONCEPT: fan out one variant molecule per concept"
type = "task"
needs = ["specify"]
labels = ["cad", "phase:concept", "fanout"]
description = "Choose 2-4 distinct answers to the main trade-off and one shared node-id vocabulary. Bond one mol-cad-variant per variant onto this step, all before dispatch: `bd mol bond mol-cad-variant <this-step> --type parallel --ref variant-<id> --var product={{product}} --var scope={{scope}} --var variant=<id> --var tradeoff='<answer>'`. Dispatch every ready subagent step below this step in ONE parallel batch, one cad-concept-designer per variant, as skill://cad-flow Delegation describes. Close each molecule's step and root from its worker's report; dispatch a failed variant again in the next batch. Close this step when every child is closed."

[steps.metadata]
skill_hints = "cad-flow, cad-concept"

[[steps]]
id = "concept-integrate"
title = "L0 CONCEPT: merge the variants and collect feedback"
type = "task"
needs = ["concept-fanout"]
waits_for = "all-children"
labels = ["cad", "phase:concept"]
description = "Merge the drafted variants into `hw/concept/<product-id>.scene.json`, keeping their ids. Check it with `uv run --script skill://cad-concept/scripts/concept.py check <scene>` and serve the live preview as a background job with `uv run --script skill://cad-concept/scripts/serve.py --scene-dir hw/concept`; send the user the `url` from its first stdout line, and stop the server as skill://cad-concept describes once the VARIANT gate passes. Gather feedback; refine, merge, or drop as directed, or bond mol-cad-concept onto the VARIANT gate for a further worker round. Before LAYOUT freeze, concept commit batches save screenshots and defer the broader recheck. Record candidates and feedback."

[steps.metadata]
skill_hints = "cad-concept, cad-flow"
execution_mode = "interactive"

[[steps]]
id = "variant-gate"
title = "VARIANT gate: select the concept"
type = "task"
needs = ["concept-integrate"]
labels = ["cad", "phase:gate"]
description = "Present the current 2-4 rendered variants, tradeoffs, and unresolved questions. Obtain explicit user selection or direction to refine, merge, or drop variants. Keep this gate open until the user approves a variant; only bd gate resolve closes it."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "layout"
title = "L1 LAYOUT: define the single-part envelope and interfaces"
type = "task"
needs = ["variant-gate"]
labels = ["cad", "phase:layout"]
description = "Run skill://cad-model and skill://cad-record. After explicit VARIANT selection, export the chosen concept with `uv run --script skill://cad-concept/scripts/concept.py handoff <scene> --out <new scratch path under .cad-work/>`. Define the one-part subassembly, labelled interfaces, envelope, datums, constraints, joints and motion limits when applicable, plus an EBOM skeleton. See cad-record/references/layout.md for path ownership; use its layout API rather than restating paths. Before an existing project freezes, run `uv run --script skill://cad-record/scripts/validate.py <project-dir> --migration-plan` (read-only). For each L1 commit batch, run `cad-model run`, `cad-model check` and `cad-render` for that version; once it has an independent movable joint, also run `cad-motion` `motion.py render --hw hw --version vN --case default --outputs glb,sheet`, whose exit 1 blocks the gate. Matching recipes reuse immutable bundles; changed recipes require `--replace` and retain the prior bundle. Explicit outputs must be new paths under `.cad-work/`. Record the design entry and bead note."

[steps.metadata]
skill_hints = "cad-model, cad-record, cad-flow"

[[steps]]
id = "layout-freeze-gate"
title = "LAYOUT freeze gate"
type = "task"
needs = ["layout"]
labels = ["cad", "phase:gate"]
description = "Present labelled layout, envelope, interfaces, joints and limits, and EBOM skeleton. Ask the user to freeze the layout explicitly. From this point onward, each commit batch rechecks changed parts and dependents with this stage's checks and all earlier stages' checks. Only bd gate resolve closes the gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "parts-fanout"
title = "L2 PARTS: fan out the part molecule and one sourcing molecule per purchased family"
type = "task"
needs = ["layout-freeze-gate"]
labels = ["cad", "phase:parts", "fanout"]
description = "Bond the part and its purchased families onto this step before dispatch: one `bd mol bond mol-cad-part <this-step> --type parallel --ref part-<PN> --var product={{product}} --var scope={{scope}} --var subassembly=<PN> --var change='<change for the part>' --var kernel={{kernel}} --var process_default={{process_default}}` for the part, and one `bd mol bond mol-cad-sourcing <this-step> --type parallel --ref source-<family> --var product={{product}} --var scope={{scope}} --var family=<id> --var parts=<PN,PN>` per purchased family in hw/bom.csv (make_buy buy). Dispatch every ready subagent step below this step in ONE parallel batch (cad-part-designer, cad-sourcing-researcher), as skill://cad-flow Delegation describes. Close each molecule's steps and root from its worker's report; dispatch a failed unit again in the next batch. Close this step when every child is closed."

[steps.metadata]
skill_hints = "cad-flow"

[[steps]]
id = "parts-integrate"
title = "L2 PARTS: integrate the delivered parts and build one version"
type = "task"
needs = ["parts-fanout"]
waits_for = "all-children"
labels = ["cad", "phase:parts"]
description = "Accept the part delivery only with its passing scratch build. Decide every proposal and sourcing finding, apply accepted ones to shared records, and record declined proposals. Commit one integrated batch with cad-model run/check, form_check at F2 (every made part needs F2), and render; a blocking check stops it. Run cad-recheck for changed parts and dependents. Use cad-record's `references/layout.md` and API for version paths; explicit check output is a new `.cad-work/` file. Record the design entry and bead note."

[steps.metadata]
skill_hints = "cad-model, cad-design, cad-render, cad-viewer, cad-recheck, cad-record"

[[steps]]
id = "parts-gate"
title = "PARTS gate for {{product}}"
type = "task"
needs = ["parts-integrate"]
labels = ["cad", "phase:gate"]
description = "Present the integrated version: renders, check and form results, sourcing decisions, and declined proposals, each file as an absolute path on its own line, plus the viewer URL when it runs. Ask the user to approve the parts or name changes. Only bd gate resolve after explicit approval closes this gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "detail-fanout"
title = "L3 DETAIL: fan out the detail molecule"
type = "task"
needs = ["parts-gate"]
labels = ["cad", "phase:detail", "fanout"]
description = "Bond one mol-cad-detail for the made part onto this step: `bd mol bond mol-cad-detail <this-step> --type parallel --ref detail-<PN> --var product={{product}} --var scope={{scope}} --var part=<PN> --var change='<detail for the part>' --var kernel={{kernel}} --var process_default={{process_default}}`. Dispatch every ready subagent step below this step to a cad-part-designer worker, as skill://cad-flow Delegation describes. Close each molecule's steps and root from its worker's report; dispatch it again after a failure. Close this step when every child is closed."

[steps.metadata]
skill_hints = "cad-flow"

[[steps]]
id = "detail-integrate"
title = "L3 DETAIL: integrate the detailed part, build one version, and draw it"
type = "task"
needs = ["detail-fanout"]
waits_for = "all-children"
labels = ["cad", "phase:detail"]
description = "Accept a delivery only with its passing F3 scratch build. Decide every fit, interface, and limit proposal and apply accepted ones to shared records. Commit one batch: cad-model run then check (a blocking failure stops it), form_check on the built version at F3 (every made part needs F3), and render. Use cad-drawings to draft, review and publish the version-bound part drawing; use its scratch output paths and the canonical layout API rather than hand-choosing roots. Recheck changed parts and dependents with skill://cad-recheck. Record the design entry and bead note."

[steps.metadata]
skill_hints = "cad-fits, cad-drawings, cad-design, cad-recheck, cad-record, cad-flow"

[[steps]]
id = "detail-gate"
title = "DETAIL gate for {{product}}"
type = "task"
needs = ["detail-integrate"]
labels = ["cad", "phase:gate"]
description = "Present the integrated version's renders, F3 form results, fit decisions, and drawing previews and PDFs, each file as an absolute path on its own line, plus the viewer URL when it runs. Ask the user to approve the detail or name changes. Only bd gate resolve after explicit approval closes this gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "bom"
title = "EBOM: complete the product bill of materials"
type = "task"
needs = ["detail-gate"]
labels = ["cad", "phase:bom"]
description = "Run skill://cad-bom to reconcile BOM skeleton, part records, quantities, make/buy, suppliers, materials, and revisions into hw/bom.csv, using the accepted sourcing findings. Draft and preview, collect feedback, then on a commit batch recheck the changed part and dependents at this stage and all earlier stages. Record the design-record entry and bead note."

[steps.metadata]
skill_hints = "cad-bom, cad-recheck, cad-record, cad-flow"

[[steps]]
id = "analysis-fanout"
title = "L4 ANALYSIS: fan out one analysis molecule per case"
type = "task"
needs = ["bom"]
labels = ["cad", "phase:analysis", "fanout"]
description = "Build and check the version vN that L4 analyses when the record changed since the last integrated version. List the cases: the joint sweep, the FreeCAD assembly check, each tolerance stack-up, each static FEA case, and each motion case the use cases need. Bond every case that needs no other case's output onto this step before dispatch: `bd mol bond mol-cad-analysis <this-step> --type parallel --ref analysis-<case> --var product={{product}} --var scope={{scope}} --var case=<id> --var kind=sweep|assembly|stackup|fea|motion --var version=vN`. Dispatch every ready subagent step below this step in ONE parallel batch of cad-analyst workers, as skill://cad-flow Delegation describes. An FEA case at the worst-case pose sets `evidence:` to the sweep's `worst.step.json`: bond and dispatch those cases as the next batch once the sweep molecule closes. Close each molecule from its worker's report. Close this step when every child is closed."

[steps.metadata]
skill_hints = "cad-flow, cad-motion, cad-analysis"

[[steps]]
id = "analysis-integrate"
title = "L4 ANALYSIS: record the verification evidence"
type = "task"
needs = ["analysis-fanout"]
waits_for = "all-children"
labels = ["cad", "phase:analysis"]
description = "Check each analysis case's inputs and warnings, then write accepted verification.csv rows tied to requirements and version vN. A failed case blocks the gate and routes a design fix through a new L2 or L3 batch. Analysts read the version's record snapshot and use each producer's immutable bundle default; explicit output overrides must be new `.cad-work/` paths. Copy each accepted motion plan to `hw/motion/cases/<case>/plan.yaml` and publish it with `motion.py render --hw hw --version vN --case <case> --outputs glb,sheet,video`; a record with coupled joints adds `--crosscheck freecad`, and only `solved` joints in `crosscheck.json` count as independent evidence. Render the analyzed version. Recheck affected parts and dependents from `flow.recheck_from`. Do not slice or create CAM/machine output."

[steps.metadata]
skill_hints = "cad-analysis, cad-motion, cad-record, cad-recheck, cad-flow"

[[steps]]
id = "analysis-gate"
title = "ANALYSIS gate for {{product}}"
type = "task"
needs = ["analysis-integrate"]
labels = ["cad", "phase:gate"]
description = "Present each case's verdict and key numbers, the worst-case pose, and the verification rows, each result file and render as an absolute path on its own line, plus the viewer URL when it runs. Ask the user to approve the analysis or name changes. Only bd gate resolve after explicit approval closes this gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "mech-critique"
title = "CRITIQUE mechanical soundness"
type = "task"
needs = ["analysis-gate"]
labels = ["cad", "phase:critique"]
description = "Spawn the read-only mechanical reviewer in the SAME parallel batch as the DFM critique. Have it challenge requirements, load paths, interfaces, joints, tolerances, failure modes, analysis assumptions, and evidence. Return PASS, MINOR, or MAJOR with named evidence; do not edit product files or ask the user."

[steps.metadata]
skill_hints = "cad-review-mech"
execution_agent_type = "cad-mech-reviewer"
execution_mode = "subagent"

[[steps]]
id = "dfm-critique"
title = "CRITIQUE manufacturability"
type = "task"
needs = ["analysis-gate"]
labels = ["cad", "phase:critique"]
description = "Spawn the read-only DFM reviewer in the SAME parallel batch as the mechanical critique. Review the selected FDM or CNC process, access, orientation, supports/tool access, stock, features, tolerances, materials, finishes, and drawings. Return PASS, MINOR, or MAJOR with named evidence; do not edit product files or ask the user."

[steps.metadata]
skill_hints = "cad-review-dfm"
execution_agent_type = "cad-dfm-reviewer"
execution_mode = "subagent"

[[steps]]
id = "reconcile"
title = "RECONCILE design and manufacturing findings"
type = "task"
needs = ["mech-critique", "dfm-critique"]
labels = ["cad", "phase:reconcile"]
description = "Reconcile both read-only reports against the model and record. Resolve every reproducible MAJOR and agreed MINOR finding, routing part changes through a new L2 or L3 batch; report unreproduced findings rather than silently dropping them. Recheck only changed assertions and their dependent parts using skill://cad-recheck. Record the disposition and evidence."

[steps.metadata]
skill_hints = "cad-flow, cad-recheck, cad-record"

[[steps]]
id = "design-freeze-gate"
title = "DESIGN freeze gate"
type = "task"
needs = ["reconcile"]
labels = ["cad", "phase:gate"]
description = "Present the final record, part revisions, EBOM, drawings, verification evidence, and both critique verdicts. Ask the user to freeze the design explicitly. Changes after this freeze reopen only affected parts and their impacted dependents; do not reopen unchanged parts. Only bd gate resolve closes the gate."

[steps.gate]
type = "human"
timeout = "72h"

[[steps]]
id = "release-package"
title = "RELEASE: assemble and validate the package"
type = "task"
needs = ["design-freeze-gate"]
labels = ["cad", "phase:release"]
description = "Run skill://cad-record to validate freeze completeness and seal the frozen release with `uv run --script skill://cad-record/scripts/release.py hw --rev <letter> --version <vN> --decision <DR-###>`. Set the part revision to its released letter before building the version to freeze; record flow.frozen with exact version, manifest SHA-256 and decision. Run release.py instead of writing an inventory: missing, stale or failing inputs refuse and manufacturing failures cannot be waived. Never reuse a revision. Use cad-record's layout API for bundle paths; it owns exact manufacturing, drawing, analysis and evidence inventory and copied release contents. Rebuild or republish named failed/stale inputs and retry. Report print/make files, buy items and OPEN reasons, assembly steps, and checks as structured lists/tables with absolute paths."

[steps.metadata]
skill_hints = "cad-record, cad-bom, cad-drawings"

[[steps]]
id = "release-gate"
title = "RELEASE gate for {{product}}"
type = "task"
needs = ["release-package"]
labels = ["cad", "phase:gate"]
description = "Present the validated manifest and print/make files, buy items including OPEN identity fields and reasons, assembly steps, and checks as structured lists or tables. Give every referenced file on its own absolute-path line. Obtain explicit user approval to release. An incomplete or failed verification matrix blocks approval. Only bd gate resolve closes the gate."

[steps.gate]
type = "human"
timeout = "72h"
