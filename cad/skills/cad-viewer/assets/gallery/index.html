<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cad-viewer gallery</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/panel.css" />
    <link rel="stylesheet" href="/gallery.css" />
    <script type="module" src="/gallery.js"></script>
  </head>
  <body data-state="loading">
    <header class="bar">
      <h1 id="product">Preview gallery</h1>
      <span class="version-badge" id="badge">—</span>
      <label class="field" for="version">
        <span class="field-label">Version</span>
        <select class="select" id="version" disabled></select>
      </label>
      <a class="button button-ghost link-button" id="viewer-link" href="/" target="_blank" rel="noopener">
        Live 3D viewer
      </a>
      <p class="status" id="status" role="status" aria-live="polite">Loading the gallery…</p>
    </header>
    <main class="gallery" id="gallery" aria-busy="true">
      <p class="project">
        <span class="field-label">Project</span>
        <code class="path" id="hw">—</code>
      </p>
      <div id="sections"></div>
    </main>
  </body>
</html>
