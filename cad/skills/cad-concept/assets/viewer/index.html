<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Concept viewer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="viewer.css" />
    <!-- three is pinned to one exact release. serve.py fetches each module once from
         jsDelivr, checks it against the digest below, and caches it for offline reuse. -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three@0.186.1/build/three.module.js",
          "three/addons/": "/vendor/three@0.186.1/examples/jsm/"
        },
        "integrity": {
          "/vendor/three@0.186.1/build/three.module.js": "sha384-m8JoFX52V6NGv2usipnlLJKnJfL7IE8dbniPDDCSGSQv3Hm4n6PjfV6syVwfuoRc",
          "/vendor/three@0.186.1/build/three.core.js": "sha384-mdKeCwPEcbDvzaxwhm+MVuLoMou+E7jQqrs4tmu/n8HBYPGI1kZt0MkJxlMR4zFM",
          "/vendor/three@0.186.1/examples/jsm/controls/OrbitControls.js": "sha384-LSqANrugPGTgf0eYsQTloqKWy926dOOXo2iZ9y6wLMIDEQoU9AaCLJF1Vcc7oJXr"
        }
      }
    </script>
    <script
      type="module"
      src="viewer.js"
      onerror="document.body.dataset.state = 'error'; document.getElementById('status').textContent = 'The viewer could not load three.js. Start it through serve.py with network access once, then reload.'"
    ></script>
  </head>
  <body>
    <div class="app">
      <main class="stage" id="stage">
        <canvas id="view" role="img" aria-label="3D view of the concept variants"></canvas>
        <div class="labels" id="labels" aria-hidden="true"></div>
        <div class="overlay" id="overlay" role="alert" hidden>
          <p class="overlay-title" id="overlay-title"></p>
          <p class="overlay-body" id="overlay-body"></p>
        </div>
        <p class="status" id="status" role="status" aria-live="polite">Loading viewer…</p>
      </main>

      <aside class="panel" aria-label="Concept controls">
        <header class="panel-header">
          <div class="panel-title-row">
            <h1 id="scene-title">Concept viewer</h1>
            <span class="live" id="live" data-state="connecting">Connecting</span>
          </div>
          <p class="scene-file" id="scene-file">No scene loaded</p>
          <label class="scene-picker" id="scene-picker" hidden>
            <span>Scene file</span>
            <select id="scene-select"></select>
          </label>
          <p class="notice" id="notice" role="alert" hidden></p>
        </header>

        <section class="panel-section" aria-labelledby="variants-heading">
          <h2 id="variants-heading">Variants</h2>
          <ul class="variant-list" id="variant-list"></ul>
        </section>

        <section class="panel-section" aria-labelledby="view-heading">
          <h2 id="view-heading">View</h2>
          <div class="toggles">
            <label class="toggle"><input type="checkbox" id="toggle-part-labels" checked /> Part labels</label>
            <label class="toggle"><input type="checkbox" id="toggle-group-labels" checked /> Group labels</label>
          </div>
          <div class="actions">
            <button type="button" class="button button-primary" id="screenshot" disabled>Save screenshot</button>
            <button type="button" class="button button-ghost" id="fit-view" disabled>Fit view</button>
          </div>
          <p class="shot-result" id="shot-result" role="status" aria-live="polite"></p>
        </section>
      </aside>
    </div>
  </body>
</html>
