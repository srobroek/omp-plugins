name = "go-app"
summary = "Go application"
layers = ["base", "tooling", "hooks", "lang/go", "ci/github", "release", "agentic"]
[vars]
web_ui = false
speckit = false
[plugins."srobroek-omp"]
source = "srobroek/omp-plugins"
plugins = ["architecture", "go", "backend"]
[commands]
setup = "mise install && go mod download"
test = "go test -race ./..."
lint = "golangci-lint run ./..."
fmt = 'test -z "$(gofmt -l .)"'
check = "go vet ./..."
