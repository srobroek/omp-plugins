name = "go-lib"
summary = "Go library"
layers = ["base", "tooling", "hooks", "lang/go", "ci/github", "release", "agentic"]
[vars]
language = "go"
app = false
web_ui = false
speckit = false
[commands]
setup = "mise install && go mod download"
test = "go test -race ./..."
lint = "golangci-lint run ./..."
fmt = "test -z \"$(gofmt -l .)\""
check = "go vet ./..."
