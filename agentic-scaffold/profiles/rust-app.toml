name = "rust-app"
summary = "Cargo-managed Rust application"
layers = ["base", "tooling", "hooks", "lang/rust", "ci/github", "release", "agentic"]
[vars]
web_ui = false
speckit = false
[plugins."srobroek-omp"]
source = "srobroek/omp-plugins"
plugins = ["architecture", "rust", "backend"]
[commands]
setup = "mise install && cargo fetch"
test = "cargo test"
lint = "cargo clippy --all-targets --all-features -- -D warnings"
fmt = "cargo fmt --all --check"
check = "cargo check --all-targets"
