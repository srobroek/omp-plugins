name = "web-ui"
summary = "Bun web interface with the project UI toolset"
layers = ["base", "tooling", "hooks", "agentic", "web-ui"]
[vars]
language = "none"
app = true
node = "22"
bun_version = "latest"
web_ui = true
speckit = false
[commands]
setup = "mise install && bun install"
test = "bun test"
lint = "bunx oxlint"
fmt = "bunx biome check ."
check = "bunx tsc --noEmit"
