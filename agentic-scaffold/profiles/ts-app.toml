name = "ts-app"
summary = "Bun-managed TypeScript application"
layers = ["base", "tooling", "hooks", "lang/ts", "ci/github", "release", "agentic"]
[vars]
language = "ts"
app = true
node = "22"
kind = "app"
bun_version = "latest"
bts = "true"
bts_version = "3.42.2"
web_ui = false
speckit = false
[commands]
setup = "mise install && bun install"
test = "bun test"
lint = "bunx oxlint"
fmt = "bunx biome check ."
check = "bunx tsc --noEmit"
