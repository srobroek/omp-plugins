name = "tauri-desktop"
summary = "Tauri desktop TypeScript application"
layers = ["base", "tooling", "hooks", "lang/ts", "ci/github", "release", "agentic"]
[vars]
language = "ts"
kind = "app"
app = true
tauri = true
bts = "true"
bts_version = "3.42.2"
[commands]
setup = "mise install && bun install --frozen-lockfile"
test = "bun test"
lint = "bunx oxlint"
fmt = "bunx biome check ."
check = "bun run check"
