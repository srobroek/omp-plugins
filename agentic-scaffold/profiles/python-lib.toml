name = "python-lib"
summary = "uv-managed Python library"
layers = ["base", "tooling", "hooks", "lang/python", "ci/github", "release", "agentic"]
[vars]
python = "3.13"
web_ui = false
speckit = false
[plugins."srobroek-omp"]
source = "srobroek/omp-plugins"
plugins = ["architecture", "python"]
[commands]
setup = "mise install && uv sync"
test = "uv run pytest"
lint = "uv run ruff check . && uv run pyright"
fmt = "uv run ruff format --check ."
check = "uv run ty check"
