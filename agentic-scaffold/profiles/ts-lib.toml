name = "ts-lib"
summary = "Bun-managed TypeScript library"
layers = ["base", "tooling", "hooks", "lang/ts", "ci/github", "release", "agentic"]
[vars]
node = "22"
bun_version = "latest"
web_ui = false
speckit = false
[plugins."srobroek-omp"]
source = "srobroek/omp-plugins"
plugins = ["architecture", "typescript"]
[commands]
setup = "mise install && bun install"
test = "bun test"
lint = "bunx oxlint"
fmt = "bunx biome check ."
check = "bunx tsc --noEmit"
