formula = "mol-scaffold-brownfield"
description = "Retrofit a repository with interview-approved agentic-scaffold layers"
type = "workflow"

[vars.feature]
required = true
pattern = "^[0-9]{3}-[a-z0-9-]+$"

[vars.autonomous]
default = "no"

[vars.layout]
default = "single"

[[steps]]
id = "inspect"
title = "inspect brownfield {{feature}}"
type = "task"
priority = 1
description = "Inspect stacks, existing instructions, hooks, tooling, beads, context files, and repository state without mutation."

[[steps]]
id = "interview"
title = "interview brownfield {{feature}}"
type = "task"
needs = ["inspect"]
priority = 1
description = "Confirm the detected profile and resolve hook-manager, unowned-file, and marker findings."

[steps.gate]
type = "human"

[[steps]]
id = "answers-write"
title = "write brownfield answers {{feature}}"
type = "task"
needs = ["interview"]
description = "Write the approved profile, layers, and overrides to .omp/scaffold-answers.toml."

[[steps]]
id = "preflight"
title = "preflight brownfield scaffold {{feature}}"
type = "task"
needs = ["answers-write"]
description = "Run scaffold.py preflight and stop on hard requirements or unresolved hook strategy."
[[steps]]
id = "plan"
title = "plan brownfield changes {{feature}}"
type = "task"
needs = ["answers-write", "preflight"]
priority = 1
description = "Review every create, skip, update-block, adopt, and conflict row before rendering."

[[steps]]
id = "render"
title = "render brownfield layers {{feature}}"
type = "task"
needs = ["plan"]
description = "Render only approved layers; preserve user files and update managed blocks."

[[steps]]
id = "members-import"
title = "import workspace members {{feature}}"
type = "task"
needs = ["render"]
condition = "{{layout}} == monorepo"
description = "Run scaffold.py member import for detected existing workspace members without rewriting their files."

[[steps]]
id = "tools-install"
title = "install brownfield tools {{feature}}"
type = "task"
needs = ["render", "members-import"]
description = "Pin and install every tool declared by the selected layers."
[[steps]]
id = "hooks-install"
title = "install brownfield hooks {{feature}}"
type = "task"
needs = ["tools-install"]
description = "Install declared prek stages, or migrate only after the interview resolves a foreign manager."

[[steps]]
id = "plugins-sync"
title = "sync brownfield plugins {{feature}}"
type = "task"
needs = ["hooks-install"]
description = "Apply the desired project plugin set without mutating user scope."

[[steps]]
id = "context-refresh"
title = "refresh brownfield context {{feature}}"
type = "task"
needs = ["plugins-sync"]
description = "Refresh Graphify and Repomix context when the agentic layer is selected."

[[steps]]
id = "doctor"
title = "doctor brownfield scaffold {{feature}}"
type = "task"
needs = ["context-refresh"]
description = "Run scaffold.py doctor and retain its exit code and JSON report."

[[steps]]
id = "commit"
title = "approve brownfield commit {{feature}}"
type = "task"
needs = ["doctor"]
priority = 1
description = "Review the bounded retrofit diff and commit only after human confirmation."

[steps.gate]
type = "human"
