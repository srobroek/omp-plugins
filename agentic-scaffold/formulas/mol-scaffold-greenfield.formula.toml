formula = "mol-scaffold-greenfield"
description = "Scaffold a greenfield repository with interview, layers, and verification"
type = "workflow"

[vars.feature]
required = true
pattern = "^[0-9]{3}-[a-z0-9-]+$"

[vars.profile]
required = true

[vars.autonomous]
default = "no"

[[steps]]
id = "interview"
title = "interview scaffold {{feature}}"
type = "task"
priority = 1
description = "Ask the fixed greenfield questions, derive the profile, and present the answers file for human approval."

[steps.gate]
type = "human"

[[steps]]
id = "answers-write"
title = "write scaffold answers {{feature}}"
type = "task"
needs = ["interview"]
description = "Run scaffold.py answers write and commit .omp/scaffold-answers.toml as the desired input."

[[steps]]
id = "plan"
title = "plan scaffold {{feature}}"
type = "task"
needs = ["answers-write"]
priority = 1
description = "Run scaffold.py plan (or render --dry-run) and resolve every conflict before rendering."

[[steps]]
id = "render"
title = "render scaffold {{feature}}"
type = "task"
needs = ["plan"]
description = "Render the selected layers; preserve user files and update managed blocks only."

[[steps]]
id = "tools-install"
title = "install tools for {{feature}}"
type = "task"
needs = ["render"]
description = "Run scaffold.py tools install --yes and the profile dependency setup command."

[[steps]]
id = "hooks-install"
title = "install hooks for {{feature}}"
type = "task"
needs = ["tools-install"]
description = "Run scaffold.py hooks install, using --migrate only after resolving a foreign hook-manager finding."

[[steps]]
id = "plugins-sync"
title = "sync project plugins for {{feature}}"
type = "task"
needs = ["hooks-install"]
description = "Run scaffold.py plugins sync at project scope; never mutate user scope."

[[steps]]
id = "context-refresh"
title = "refresh project context for {{feature}}"
type = "task"
needs = ["plugins-sync"]
condition = "{{profile}} != agentic-repo"
description = "Refresh Graphify and Repomix context when the selected stack includes the agentic layer."

[[steps]]
id = "doctor"
title = "doctor scaffold {{feature}}"
type = "task"
needs = ["plugins-sync", "context-refresh"]
description = "Run scaffold.py doctor and retain the JSON report; exit 2 is drift and exit 1 is an operational error."

[[steps]]
id = "commit"
title = "approve scaffold commit {{feature}}"
type = "task"
needs = ["doctor"]
priority = 1
description = "Review generated files, answers, plugin scope, and doctor output before committing."

[steps.gate]
type = "human"
