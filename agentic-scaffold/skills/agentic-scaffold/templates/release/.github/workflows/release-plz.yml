name: Release plz
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-plz
  cancel-in-progress: false
jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - uses: release-plz/action@a80d79efe0a195618acb02a4089d55fe74d2505f # v0.5.136
        with:
          command: release-pr
          token: ${{ secrets.GITHUB_TOKEN }}
  release:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: release-pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      ACTIONS_CACHE_MODE: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: Package release artifact
        run: mkdir -p dist && cargo package --locked --allow-dirty && cp target/package/*.crate dist/
      - name: Generate SBOM
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          path: dist
          format: spdx-json
          output-file: dist/sbom.spdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.crate
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.crate
          sbom-path: dist/sbom.spdx.json
      - name: Verify attestations before publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh attestation verify dist/*.crate --repo "${{ github.repository }}"
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - uses: release-plz/action@a80d79efe0a195618acb02a4089d55fe74d2505f # v0.5.136
        with:
          command: release
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
