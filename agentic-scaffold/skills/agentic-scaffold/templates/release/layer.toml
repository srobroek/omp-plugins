name = "release"
summary = "release-please plus a gated release workflow that publishes from the tagged tree"
after = ["ci/github"]
requires_tools = ["gh"]
owns = ["release-please-config.json", ".release-please-manifest.json", ".github/workflows/release-please.yml", ".github/workflows/release.yml", "release-plz.toml", ".github/workflows/release-plz.yml"]
blocks = []
conflicts_with = []
[conditional_files]
"release-please-config.json" = { var = "kind", not_any = ["crate", "hybrid"] }
".release-please-manifest.json" = { var = "kind", not_any = ["crate", "hybrid"] }
".github/workflows/release-please.yml" = { var = "kind", not_any = ["crate", "hybrid"] }
".github/workflows/release.yml" = { var = "kind", not_any = ["crate", "hybrid"] }
"release-plz.toml" = { var = "kind", any = ["crate", "hybrid"] }
".github/workflows/release-plz.yml" = { var = "kind", any = ["crate", "hybrid"] }
[tools]
gh = "latest"
[vars]
publish = { default = "", prompt = "Publish target for releases (none, pypi, npm, crates, github-assets); empty picks the language default, or none for applications", ask = true }
