name = "ci/github"
summary = "GitHub CI with parallel lanes and a single fan-in gate, plus Renovate config"
after = ["base"]
requires_tools = ["gh"]
owns = [".github/workflows/ci.yml", ".github/renovate.json"]
blocks = []
conflicts_with = []
[tools]
gh = "latest"

[vars]
ci_codeql = { default = "", prompt = "Enable CodeQL for supported selected languages (public repositories default to true when visibility is known; Rust is not a CodeQL language)", ask = true }
ci_harden_runner = { default = "false", prompt = "Enable step-security/harden-runner in audit mode for every CI job; move to block after reading the audit", ask = true }