name = "github"
summary = "repository policy applied through the GitHub API"
after = ["base"]
requires_tools = ["git", "gh"]
owns = []
blocks = []
conflicts_with = []
[vars]
cla = { default = "false", prompt = "Enable CLA", ask = false }
reviews = { default = "0", prompt = "Required reviews", ask = false }
[conditional_files."CLA.md"]
var = "cla"
equals = "true"
[conditional_files.".github/workflows/cla.yml"]
var = "cla"
equals = "true"
