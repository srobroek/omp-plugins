name = "agentic"
summary = "Project-local OMP desired plugins and context"
after = ["base", "tooling", "hooks"]
requires_tools = ["omp"]
owns = [".omp/mcp.json", ".omp/context.py", ".omp/repomix.json", ".omp/project-context.json", ".omp/plugins.toml", "CLAUDE.md", ".codex/AGENTS.md", ".lsp.json", ".mcp.json"]
blocks = ["AGENTS.md", "WATCHDOG.md", ".gitignore"]
conflicts_with = []
[tools]
# npm-backed tools need a pinned node in the isolated project env
node = "latest"
"pipx:graphifyy[mcp]" = "latest"
"npm:repomix" = "latest"
[conditional_tools]
"aqua:gastownhall/beads" = { var = "beads", equals = "true", version = "latest" }
