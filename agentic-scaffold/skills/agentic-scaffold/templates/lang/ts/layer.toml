name = "lang/ts"
summary = "TypeScript package or OMP plugin"
after = ["base", "tooling"]
requires_tools = ["bun"]
owns = ["package.json", "tsconfig.json", "biome.json", "src/index.ts", "test/index.test.ts", "bin/index.ts", ".omp-plugin/plugin.json", "extensions/index.ts", "skills/README.md", "rules/README.md", "agents/README.md", "formulas/README.md"]
blocks = [".gitignore", "justfile", ".pre-commit-config.yaml"]
conflicts_with = ["lang/python", "lang/rust", "lang/go", "lang/terraform", "workspace"]
[conditional_files]
"bin/index.ts" = { var = "kind", equals = "app" }
".omp-plugin/plugin.json" = { var = "kind", equals = "omp-plugin" }
"extensions/index.ts" = { var = "kind", equals = "omp-plugin" }
"skills/README.md" = { var = "kind", equals = "omp-plugin" }
"rules/README.md" = { var = "kind", equals = "omp-plugin" }
"agents/README.md" = { var = "kind", equals = "omp-plugin" }
"formulas/README.md" = { var = "kind", equals = "omp-plugin" }
[plugins."srobroek-omp"]
source = "srobroek/omp-plugins"
plugins = ["architecture", "typescript"]
when = { var = "language", equals = "ts" }
[tools]
node = "${node}"
bun = "${bun_version}"
[vars]
node = { default = "22", prompt = "Node version", ask = false }
bun_version = { default = "latest", prompt = "Bun version", ask = false }
kind = { default = "library", prompt = "TypeScript kind (library, app, or omp-plugin)", ask = true }
