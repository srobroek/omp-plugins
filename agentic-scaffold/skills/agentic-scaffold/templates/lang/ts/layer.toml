name = "lang/ts"
summary = "Bun-managed TypeScript package"
after = ["base", "tooling"]
requires_tools = ["bun"]
owns = ["package.json", "src/index.ts", "test/index.test.ts"]
blocks = [".gitignore", "justfile", ".pre-commit-config.yaml"]
conflicts_with = ["lang/python", "lang/rust", "lang/go", "lang/terraform"]
conditional_plugins = { backend = { var = "app", equals = "true" } }
[vars]
node = { default = "22", prompt = "Node version", ask = false }
bun_version = { default = "latest", prompt = "Bun version", ask = false }
[plugins."srobroek-omp"]
source = "srobroek/omp-plugins"
plugins = ["architecture", "typescript"]
when = { var = "language", equals = "ts" }
