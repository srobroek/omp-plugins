name = "lang/go"
summary = "Go package or command"
after = ["base", "tooling"]
requires_tools = ["go"]
owns = ["go.mod", "__name__.go", "cmd/__name__/main.go", "internal/README.md", ".golangci.yml", ".goreleaser.yaml"]
blocks = [".gitignore", "justfile", ".pre-commit-config.yaml"]
conflicts_with = ["lang/python", "lang/ts", "lang/rust", "lang/terraform", "workspace"]
[conditional_files]
"__name__.go" = { var = "kind", equals = "library" }
"cmd/__name__/main.go" = { var = "kind", equals = "tool" }
".goreleaser.yaml" = { var = "kind", equals = "tool" }
[plugins."srobroek-omp"]
source = "srobroek/omp-plugins"
plugins = ["architecture", "go"]
when = { var = "language", equals = "go" }
[tools]
go = "latest"
[vars]
kind = { default = "library", prompt = "Go kind (library or tool)", ask = true }
