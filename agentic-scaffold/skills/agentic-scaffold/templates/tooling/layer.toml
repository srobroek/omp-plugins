name = "tooling"
summary = "mise tool versions and just task runner"
after = ["base"]
requires_tools = ["mise", "just"]
owns = ["mise.toml"]
blocks = ["justfile"]
conflicts_with = []
[tools]
prek = "latest"
just = "latest"
[vars]
node = { default = "22", prompt = "Node version", ask = false }
bun_version = { default = "latest", prompt = "Bun version", ask = false }
