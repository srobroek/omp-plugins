name = "docs"
summary = "Project documentation and optional site"
after = ["base"]
conflicts_with = []
owns = ["docs/adr/0001-record-architecture-decisions.md", "docs/architecture.md", ".omp/docs.json", "site/astro.config.mjs", "site/package.json", "site/src/pages/index.astro", "mkdocs.yml", "docs/index.md", "book.toml", "docs/src/SUMMARY.md"]
[vars]
docs_flavour = { default = "none", prompt = "Documentation flavour (none, splash, or site)", ask = true }
[conditional_files]
"site/astro.config.mjs" = { var = "docs_flavour", equals = "splash" }
"site/package.json" = { var = "docs_flavour", equals = "splash" }
"site/src/pages/index.astro" = { var = "docs_flavour", equals = "splash" }
"mkdocs.yml" = { all = [{ var = "docs_flavour", equals = "site" }, { var = "language", any = ["python", "ts", "go", "none"] }] }
"docs/index.md" = { all = [{ var = "docs_flavour", equals = "site" }, { var = "language", any = ["python", "ts", "go", "none"] }] }
"book.toml" = { all = [{ var = "docs_flavour", equals = "site" }, { var = "language", equals = "rust" }] }
"docs/src/SUMMARY.md" = { all = [{ var = "docs_flavour", equals = "site" }, { var = "language", equals = "rust" }] }
